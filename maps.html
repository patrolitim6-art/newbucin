<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BUCIN Maps</title>

<script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" />
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet" />

<style>
:root {
  --primary-cyan: #00D9FF; --primary-purple: #A855F7; --primary-green: #10B981;
  --primary-red: #EF4444; --primary-amber: #F59E0B;
  --tech-gradient: linear-gradient(135deg, #00D9FF 0%, #0EA5E9 45%, #A855F7 100%);
  --surface-1: rgba(15, 23, 42, 0.7); --surface-3: #0F172A;
  --surface-modal: linear-gradient(180deg, #0F172A 0%, #0A0E1A 100%);
  --surface-input: rgba(10, 14, 26, 0.7);
  --surface-map-legend: rgba(10, 14, 26, 0.92);
  --surface-map-btn: rgba(10, 14, 26, 0.9);
  --text-main: #E2E8F0; --text-muted: #94A3B8; --text-dim: #64748B;
  --text-on-accent: #050810;
  --border-glow: rgba(0, 217, 255, 0.25); --border-subtle: rgba(148, 163, 184, 0.15);
  --bg-main: #0A0E1A;
  --shadow-modal: 0 24px 64px rgba(0, 217, 255, 0.15);
  --header-h: 60px;
  --header-solid: #0F172A;
  --header-solid-border: rgba(0, 217, 255, 0.35);
  --app-font: 'DM Sans', sans-serif;
  --app-font-size: 14px;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; overflow: hidden; font-family: var(--app-font); background: var(--bg-main); color: var(--text-main); }

.top-header {
  position: sticky; top: 0; z-index: 9000;
  height: var(--header-h);
  border-bottom: 1px solid var(--header-solid-border);
  background: var(--header-solid);
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 14px; gap: 10px;
  box-shadow: 0 2px 12px rgba(0, 0, 0, 0.35);
}
.header-brand { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
.brand-text { font-weight: 900; font-family: 'Orbitron', sans-serif; background: var(--tech-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; letter-spacing: 1.5px; font-size: 20px; }
.brand-sub { color: var(--primary-cyan); font-weight: 700; text-transform: uppercase; letter-spacing: 1.2px; font-family: 'Orbitron', sans-serif; font-size: 9px; }

.header-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.header-btn {
  background: transparent; border: 1px solid rgba(255, 255, 255, 0.25); color: #E2E8F0;
  padding: 8px 14px; border-radius: 8px; font-size: 12px; font-weight: 700;
  cursor: pointer; font-family: inherit; display: inline-flex; align-items: center; gap: 6px;
  transition: all 0.2s;
}
.header-btn:hover { color: var(--primary-cyan); border-color: var(--primary-cyan); background: rgba(0, 217, 255, 0.08); }
.header-btn.primary { color: var(--primary-green); border-color: rgba(16, 185, 129, 0.6); }
.header-btn.primary:hover { background: rgba(16, 185, 129, 0.15); border-color: var(--primary-green); color: var(--primary-green); }
.header-btn i { width: 15px; height: 15px; }

.map-wrap { position: relative; width: 100%; height: calc(100vh - var(--header-h)); }
#map-container { position: absolute; inset: 0; width: 100%; height: 100%; }

.map-legend-top-right {
  position: absolute; top: 12px; left: 12px; z-index: 1000;
  background: var(--surface-map-legend); border: 1px solid var(--border-glow);
  border-radius: 10px; padding: 8px 10px; max-width: 200px; font-size: 10px;
  max-height: 400px; overflow-y: auto;
}
.map-legend-top-right .ml-title { font-weight: 800; color: var(--primary-cyan); text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 5px; font-size: 9px; padding-bottom: 4px; border-bottom: 1px solid var(--border-subtle); }
.map-legend-top-right .ml-item { display: flex; align-items: center; gap: 5px; margin-bottom: 2px; color: var(--text-muted); font-weight: 600; }
.map-legend-top-right .ml-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.map-legend-top-right .ml-count { margin-left: auto; font-family: 'Orbitron', sans-serif; font-weight: 800; color: var(--text-main); font-size: 9px; }
.map-legend-top-right .ml-line-section { margin-top: 6px; padding-top: 6px; border-top: 1px solid var(--border-subtle); }
.map-legend-top-right .ml-line-item { display: flex; align-items: center; gap: 5px; margin-bottom: 3px; color: var(--text-muted); font-weight: 600; }
.map-legend-top-right .ml-line-bar { width: 14px; height: 3px; border-radius: 2px; flex-shrink: 0; }
.map-legend-top-right .ml-line-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 9px; }

.maplibregl-popup-content { background: var(--surface-map-legend) !important; color: var(--text-main) !important; border: 1px solid var(--border-glow) !important; border-radius: 8px !important; padding: 8px 10px !important; max-width: 240px !important; font-size: 10px !important; }
.maplibregl-popup-tip { border-top-color: var(--surface-map-legend) !important; border-bottom-color: var(--surface-map-legend) !important; }
.maplibregl-popup-close-button { color: var(--primary-cyan) !important; font-size: 14px !important; }
.maplibregl-ctrl-top-right, .maplibregl-ctrl-top-left, .maplibregl-ctrl-bottom-right { display: none !important; }
.maplibregl-ctrl-bottom-left { display: block !important; }
#map-container canvas { outline: none !important; }

.custom-map-controls { position: absolute; top: 12px; right: 12px; z-index: 1000; display: flex; flex-direction: column; gap: 6px; }
.custom-map-btn { background: var(--surface-map-btn); border: 1px solid var(--border-glow); border-radius: 10px; width: 38px; height: 38px; display: grid; place-items: center; cursor: pointer; color: var(--primary-cyan); transition: all 0.2s; }
.custom-map-btn:hover { background: rgba(0, 217, 255, 0.15); }
.custom-map-btn.active { background: var(--tech-gradient); color: var(--text-on-accent); border-color: transparent; }

.draw-point { width: 12px; height: 12px; border-radius: 50%; background: #00D9FF; border: 2px solid #fff; box-shadow: 0 0 10px #00D9FF; }
.draw-point.first { background: #10B981; }
.draw-point.last { background: #EC4899; }
.draw-cursor-active #map-container, .draw-cursor-active #map-container canvas { cursor: crosshair !important; }

.modal-layer { position: fixed; z-index: 10000; inset: 0; background: rgba(5, 8, 16, 0.85); display: grid; place-items: center; padding: 20px; overflow-y: auto; }
.modal-card { background: var(--surface-modal); width: 100%; max-width: 560px; border-radius: 20px; max-height: 92vh; overflow-y: auto; padding: 22px; box-shadow: var(--shadow-modal); border: 1px solid var(--border-glow); color: var(--text-main); }
.hidden { display: none !important; }

.field-control { width: 100%; min-height: 44px; border: 1px solid var(--border-subtle); border-radius: 10px; background: var(--surface-input); padding: 0 14px; color: var(--text-main); outline: none; font-family: inherit; font-size: 13px; }
.field-control:focus { border-color: var(--primary-cyan); box-shadow: 0 0 0 3px rgba(0, 217, 255, 0.15); }
select.field-control option { background: var(--surface-3); color: var(--text-main); }

.btn-primary { background: var(--tech-gradient); color: var(--text-on-accent); border: none; border-radius: 20px; font-weight: 800; padding: 10px 22px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px; box-shadow: 0 4px 20px rgba(0, 217, 255, 0.35); min-height: 44px; font-size: 13px; font-family: inherit; }
.btn-primary:hover { filter: brightness(1.1); }
.btn-primary:disabled { opacity: 0.5; cursor: not-allowed; filter: none; }
.btn-secondary { background: var(--surface-1); color: var(--primary-cyan); border: 1px solid var(--border-glow); border-radius: 20px; font-weight: 600; padding: 10px 20px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; min-height: 44px; font-size: 13px; font-family: inherit; }
.btn-secondary:hover { background: rgba(0, 217, 255, 0.12); border-color: var(--primary-cyan); }
.btn-cancel { background: transparent; color: var(--primary-red); border: 1px solid rgba(239, 68, 68, 0.5); border-radius: 20px; font-weight: 600; padding: 10px 20px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px; font-size: 13px; font-family: inherit; }
.btn-cancel:hover { background: rgba(239, 68, 68, 0.15); }

.floating-panel {
  position: absolute; top: 12px; right: 60px;
  background: rgba(15, 23, 42, 0.98);
  border: 1px solid rgba(0, 217, 255, 0.5);
  border-radius: 12px; padding: 14px 16px;
  z-index: 950; font-size: 12px; color: #E2E8F0;
  min-width: 300px; max-width: 340px; display: none;
  box-shadow: 0 8px 24px rgba(0,0,0,0.5);
}
.floating-panel.show { display: block; }
.floating-panel .panel-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; padding-bottom: 10px; border-bottom: 1px solid rgba(255,255,255,0.1); }
.floating-panel h6 { font-size: 12px; color: var(--primary-cyan); margin: 0; text-transform: uppercase; letter-spacing: 0.5px; font-weight: 800; display: flex; align-items: center; gap: 6px; font-family: 'Orbitron', sans-serif; }
.floating-panel .panel-close { background: transparent; border: none; color: #94A3B8; cursor: pointer; font-size: 18px; padding: 0; line-height: 1; }
.floating-panel .panel-close:hover { color: var(--primary-red); }
.floating-panel .form-row { margin-bottom: 12px; }
.floating-panel label { display: block; font-size: 10px; color: #94A3B8; margin-bottom: 5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.4px; }
.floating-panel input[type="text"] { width: 100%; background: rgba(30, 41, 59, 0.8); border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 8px; color: #fff; padding: 8px 10px; font-size: 12px; font-family: inherit; }
.floating-panel input[type="text"]:focus { outline: none; border-color: var(--primary-cyan); }
.floating-panel input[type="file"] { width: 100%; padding: 8px; background: rgba(30, 41, 59, 0.8); border: 1px dashed rgba(56, 189, 248, 0.5); border-radius: 8px; color: #E2E8F0; font-size: 11px; font-family: inherit; cursor: pointer; }
.floating-panel input[type="file"]::file-selector-button { background: rgba(56, 189, 248, 0.2); color: var(--primary-cyan); border: 1px solid rgba(56, 189, 248, 0.5); border-radius: 4px; padding: 4px 10px; font-size: 10px; font-weight: 700; font-family: inherit; cursor: pointer; margin-right: 8px; }
.floating-panel input[type="color"] { width: 44px; height: 34px; background: transparent; border: 1px solid rgba(255,255,255,0.2); border-radius: 6px; cursor: pointer; padding: 2px; }
.floating-panel .color-row { display: flex; align-items: center; gap: 8px; }
.floating-panel .color-preview { font-size: 11px; color: #94A3B8; font-family: monospace; }
.floating-panel .btn-row { display: flex; gap: 8px; margin-top: 14px; }
.floating-panel .btn-row button { flex: 1; padding: 9px 12px; border-radius: 8px; font-size: 12px; font-weight: 700; cursor: pointer; font-family: inherit; display: flex; align-items: center; justify-content: center; gap: 5px; transition: all 0.2s; }
.floating-panel .btn-row button.primary { background: rgba(16, 185, 129, 0.15); border: 1px solid rgba(16, 185, 129, 0.6); color: var(--primary-green); }
.floating-panel .btn-row button.primary:hover:not(:disabled) { background: rgba(16, 185, 129, 0.25); }
.floating-panel .btn-row button.primary:disabled { opacity: 0.4; cursor: not-allowed; }
.floating-panel .btn-row button.secondary { background: transparent; border: 1px solid rgba(255, 255, 255, 0.2); color: #E2E8F0; }
.floating-panel .btn-row button.secondary:hover:not(:disabled) { border-color: var(--primary-cyan); color: var(--primary-cyan); }
.floating-panel .btn-row button.cancel { background: transparent; border: 1px solid rgba(239, 68, 68, 0.5); color: var(--primary-red); }
.floating-panel .btn-row button.cancel:hover:not(:disabled) { background: rgba(239, 68, 68, 0.15); }
.floating-panel .info-count { font-size: 10px; color: var(--primary-cyan); margin-top: 8px; text-align: center; font-weight: 700; }
.floating-panel .info-count.error { color: var(--primary-red); }
.floating-panel .info-count.success { color: var(--primary-green); }

#draw-controls {
  position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%);
  z-index: 1100; background: var(--surface-map-legend);
  border: 1px solid var(--border-glow); border-radius: 14px;
  padding: 10px 14px; display: none; align-items: center; gap: 8px;
  flex-wrap: wrap; justify-content: center; max-width: calc(100% - 24px);
}
#draw-controls.show { display: flex; }

.kml-list-item { display: flex; align-items: center; gap: 12px; padding: 12px 14px; background: var(--surface-1); border: 1px solid var(--border-subtle); border-radius: 12px; flex-wrap: wrap; margin-bottom: 8px; }
.kml-list-info { flex: 1; min-width: 0; }
.kml-list-name { font-weight: 700; color: var(--text-main); font-size: 13px; }
.kml-list-actions { display: flex; gap: 6px; flex-wrap: wrap; }
.kml-list-btn { padding: 6px 10px; border-radius: 6px; font-weight: 700; cursor: pointer; border: 1px solid; display: inline-flex; align-items: center; gap: 4px; font-family: inherit; font-size: 11px; }
.kml-list-btn.download { background: rgba(0, 217, 255, 0.1); color: var(--primary-cyan); border-color: rgba(0, 217, 255, 0.4); }
.kml-list-btn.delete { background: rgba(239, 68, 68, 0.1); color: var(--primary-red); border-color: rgba(239, 68, 68, 0.4); }
.kml-list-btn:hover { filter: brightness(1.2); }

::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: rgba(15, 23, 42, 0.5); }
::-webkit-scrollbar-thumb { background: linear-gradient(180deg, var(--primary-cyan), var(--primary-purple)); border-radius: 4px; }

@media (max-width: 640px) {
  .header-btn span { display: none; }
  .header-btn { padding: 8px 10px; }
  .floating-panel { right: 50px; left: 10px; min-width: 0; max-width: none; }
  .map-legend-top-right { max-width: 150px; font-size: 9px; }
  .custom-map-btn { width: 34px; height: 34px; }
}
</style>
</head>
<body>

<!-- ===== HEADER ===== -->
<header class="top-header">
  <div class="header-brand">
    <div>
      <div class="brand-text">BUCIN</div>
      <div class="brand-sub">Cegah Insiden Network</div>
    </div>
  </div>

  <div class="header-actions">
    <button class="header-btn" id="btn-draw-line"><i data-lucide="pen-line"></i> <span>Gambar Line</span></button>
    <button class="header-btn primary" id="btn-upload-kml"><i data-lucide="upload"></i> <span>Upload KML</span></button>
    <button class="header-btn" id="btn-manage-kml"><i data-lucide="folder-cog"></i> <span>Kelola Line</span></button>
  </div>
</header>

<!-- ===== MAP ===== -->
<div class="map-wrap">
  <div id="map-container"></div>

  <!-- LEGENDA -->
  <div class="map-legend-top-right" id="map-legend-container">
    <div class="ml-title">Keterangan Titik</div>
    <div class="ml-item"><span class="ml-dot" style="background:#FF0000;"></span>OF Cut<span class="ml-count" id="ml-count-ofcut">0</span></div>
    <div class="ml-item"><span class="ml-dot" style="background:#00FF00;"></span>Pihak Ke-3<span class="ml-count" id="ml-count-p3">0</span></div>
    <div class="ml-item"><span class="ml-dot" style="background:#0000FF;"></span>Temuan<span class="ml-count" id="ml-count-temuan">0</span></div>
    <div class="ml-item"><span class="ml-dot" style="background:#FFFF00;"></span>Joint<span class="ml-count" id="ml-count-joint">0</span></div>
    <div class="ml-item"><span class="ml-dot" style="background:#FF00FF;"></span>Handhole<span class="ml-count" id="ml-count-handhole">0</span></div>
    <div class="ml-line-section" id="ml-line-section" style="display:none;">
      <div class="ml-title" style="margin-top:0;">Keterangan Line</div>
      <div id="ml-line-list"></div>
    </div>
  </div>

  <!-- MAP CONTROLS -->
  <div class="custom-map-controls">
    <button class="custom-map-btn active" onclick="toggleMapLayer('satellite', event)" title="Satelit"><i data-lucide="satellite" style="width:16px;"></i></button>
    <button class="custom-map-btn" onclick="toggleMapLayer('street', event)" title="Jalan"><i data-lucide="map" style="width:16px;"></i></button>
    <button class="custom-map-btn" onclick="toggleMapLayer('hybrid', event)" title="Hybrid"><i data-lucide="layers" style="width:16px;"></i></button>
    <button class="custom-map-btn" onclick="map.zoomIn()" title="Zoom In"><i data-lucide="plus" style="width:16px;"></i></button>
    <button class="custom-map-btn" onclick="map.zoomOut()" title="Zoom Out"><i data-lucide="minus" style="width:16px;"></i></button>
  </div>

  <!-- DRAW CONTROLS -->
  <div id="draw-controls">
    <span style="font-weight:700;color:var(--primary-cyan);font-size:12px;">Klik peta untuk menggambar</span>
    <span id="draw-point-count" style="font-weight:700;color:var(--text-muted);background:rgba(0,217,255,0.1);padding:3px 8px;border-radius:6px;font-size:11px;">0 titik</span>
    <button onclick="finishDrawLine()" class="btn-primary" style="padding:6px 12px;font-size:11px;min-height:32px;"><i data-lucide="check" style="width:12px;"></i> Selesai</button>
    <button onclick="undoLastPoint()" class="btn-secondary" style="padding:6px 12px;font-size:11px;min-height:32px;"><i data-lucide="undo-2" style="width:12px;"></i> Undo</button>
    <button onclick="cancelDrawLine()" class="btn-cancel" style="padding:6px 12px;font-size:11px;min-height:32px;"><i data-lucide="x" style="width:12px;"></i> Batal</button>
  </div>

  <!-- PANEL UPLOAD -->
  <div class="floating-panel" id="upload-panel">
    <div class="panel-header">
      <h6><i data-lucide="upload" style="width:14px;"></i> Upload KML / KMZ</h6>
      <button class="panel-close" onclick="toggleUploadPanel()">&times;</button>
    </div>
    <div class="form-row">
      <label>Pilih Line</label>
      <select id="kml-line" class="field-control" style="min-height:38px;font-size:12px;padding:0 10px;background:rgba(30,41,59,0.8);border:1px solid rgba(255,255,255,0.2);border-radius:8px;color:#fff;width:100%;">
        <option value="">-- Pilih Line --</option>
        <option value="OSP LINE 1">OSP LINE 1</option>
        <option value="OSP LINE 2">OSP LINE 2</option>
        <option value="OSP LINE 3">OSP LINE 3</option>
        <option value="IGG LINE 1">IGG LINE 1</option>
        <option value="IGG LINE 2">IGG LINE 2</option>
        <option value="DWDM">DWDM</option>
        <option value="SEA US LINE 1">SEA US LINE 1</option>
        <option value="SEA US LINE 2">SEA US LINE 2</option>
        <option value="__custom__">+ Tambah Line Baru...</option>
      </select>
    </div>
    <div class="form-row hidden" id="kml-custom-line-wrap">
      <label>Nama Line Baru</label>
      <input type="text" id="kml-custom-line-name" placeholder="Nama line baru">
    </div>
    <div class="form-row">
      <label>File KML / KMZ</label>
      <input type="file" id="kml-file" accept=".kml,.kmz">
    </div>
    <div class="btn-row">
      <button class="primary" onclick="submitKmlUpload()" id="btn-kml-submit" disabled><i data-lucide="check" style="width:12px;"></i> Upload</button>
      <button class="cancel" onclick="toggleUploadPanel()"><i data-lucide="x" style="width:12px;"></i> Batal</button>
    </div>
    <div class="info-count" id="kml-info">Pilih line & file dulu</div>
  </div>

  <!-- PANEL GAMBAR -->
  <div class="floating-panel" id="draw-panel">
    <div class="panel-header">
      <h6><i data-lucide="pen-line" style="width:14px;"></i> Gambar Line Baru</h6>
      <button class="panel-close" onclick="toggleDrawPanel()">&times;</button>
    </div>
    <div class="form-row">
      <label>Line</label>
      <select id="draw-line-name" class="field-control" style="min-height:38px;font-size:12px;padding:0 10px;background:rgba(30,41,59,0.8);border:1px solid rgba(255,255,255,0.2);border-radius:8px;color:#fff;width:100%;">
        <option value="">-- Pilih Line --</option>
        <option value="OSP LINE 1">OSP LINE 1</option>
        <option value="OSP LINE 2">OSP LINE 2</option>
        <option value="OSP LINE 3">OSP LINE 3</option>
        <option value="IGG LINE 1">IGG LINE 1</option>
        <option value="IGG LINE 2">IGG LINE 2</option>
        <option value="DWDM">DWDM</option>
        <option value="SEA US LINE 1">SEA US LINE 1</option>
        <option value="SEA US LINE 2">SEA US LINE 2</option>
        <option value="__custom__">+ Tambah Line Baru...</option>
      </select>
    </div>
    <div class="form-row hidden" id="draw-custom-line-wrap">
      <label>Nama Line Baru</label>
      <input type="text" id="draw-custom-line-name" placeholder="Nama line baru">
    </div>
    <div class="form-row">
      <label>Keterangan (Opsional)</label>
      <input type="text" id="draw-line-notes" placeholder="Keterangan">
    </div>
    <div class="form-row" style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
      <div>
        <label>Warna</label>
        <div class="color-row">
          <input type="color" id="draw-line-color" value="#00D9FF">
          <span class="color-preview" id="draw-color-preview">#00D9FF</span>
        </div>
      </div>
      <div>
        <label>Ketebalan</label>

<script>
/* ============================================================ FIREBASE ============================================================ */
const firebaseConfig = {
  apiKey: "AIzaSyAXmwFnIs5123F9S-5v_YdvWxDXiUwO5vE",
  authDomain: "bucin-18282.firebaseapp.com",
  databaseURL: "https://bucin-18282-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "bucin-18282",
  storageBucket: "bucin-18282.firebasestorage.app",
  messagingSenderId: "545528630169",
  appId: "1:545528630169:web:2ea7db49f27121ad062108"
};
let db;
try { firebase.initializeApp(firebaseConfig); db = firebase.database(); } catch(e) { console.error('Firebase init:', e); }

/* ============================================================ STATE ============================================================ */
let map = null;
let markers = [];
let kmlLayers = {};
let kmlDataCache = null;
let customLines = {};
let drawMode = false;
let drawPoints = [];
let drawMarkers = [];
let drawCurrentLine = null;

const kmlLineColors = {
  'OSP LINE 1': '#FF0000', 'OSP LINE 2': '#00FF00', 'OSP LINE 3': '#0000FF',
  'IGG LINE 1': '#FFA500', 'IGG LINE 2': '#800080', 'DWDM': '#FF00FF',
  'SEA US LINE 1': '#00FFFF', 'SEA US LINE 2': '#FFD700'
};
const BUILTIN_LINES = ['OSP LINE 1','OSP LINE 2','OSP LINE 3','IGG LINE 1','IGG LINE 2','DWDM','SEA US LINE 1','SEA US LINE 2'];

const POINT_CATEGORIES = [
  { key: 'Data OF Cut', label: 'OF Cut', color: '#FF0000' },
  { key: 'Pekerjaan Pihak Ke-3', label: 'Pihak Ke-3', color: '#00FF00' },
  { key: 'Temuan Lapangan', label: 'Temuan', color: '#0000FF' },
  { key: 'Joint', label: 'Joint', color: '#FFFF00' },
  { key: 'Handhole', label: 'Handhole', color: '#FF00FF' }
];

/* ============================================================ HELPERS ============================================================ */
function escapeHtml(s) {
  if (s === null || s === undefined) return '';
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function escapeXml(s) { return String(s).replace(/[<>&'"]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;',"'":'&apos;','"':'&quot;'}[c])); }
function showToast(msg, type) {
  type = type || '';
  console.log('[TOAST ' + type.toUpperCase() + ']', msg);
  const ex = document.querySelector('.toast'); if (ex) ex.remove();
  const t = document.createElement('div');
  t.className = 'toast show ' + type;
  t.textContent = msg;
  const bg = type === 'error' ? 'rgba(239,68,68,0.95)' : type === 'success' ? 'rgba(16,185,129,0.95)' : 'rgba(15,23,42,0.95)';
  t.style.cssText = 'position:fixed;top:80px;left:50%;transform:translateX(-50%);background:' + bg + ';color:#fff;padding:12px 22px;border-radius:99px;font-weight:600;z-index:99999;box-shadow:0 8px 32px rgba(0,217,255,0.3);border:1px solid rgba(0,217,255,0.25);max-width:90vw;text-align:center;font-size:13px;';
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 3000);
}

/* ============================================================ MAP STYLES ============================================================ */
function getSatelliteStyle() {
  return { version: 8, sources: { satellite: { type: 'raster', tiles: ['https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'], tileSize: 256, minzoom: 0, maxzoom: 19 } }, layers: [{ id: 'satellite-layer', type: 'raster', source: 'satellite' }] };
}
function getStreetStyle() {
  return { version: 8, sources: { osm: { type: 'raster', tiles: ['https://tile.openstreetmap.org/{z}/{x}/{y}.png'], tileSize: 256, minzoom: 0, maxzoom: 19 } }, layers: [{ id: 'osm-layer', type: 'raster', source: 'osm' }] };
}
function getHybridStyle() {
  return { version: 8, sources: { hybrid: { type: 'raster', tiles: ['https://mt1.google.com/vt/lyrs=y&x={x}&y={y}&z={z}'], tileSize: 256, minzoom: 0, maxzoom: 19 } }, layers: [{ id: 'hybrid-layer', type: 'raster', source: 'hybrid' }] };
}

/* ============================================================ INIT MAP ============================================================ */
function initMap() {
  if (map) return;
  try {
    map = new maplibregl.Map({
      container: 'map-container',
      style: getSatelliteStyle(),
      center: [124.8410, 1.4930],
      zoom: 11, maxZoom: 22, minZoom: 2,
      attributionControl: false, antialias: true
    });
    map.on('load', () => {
      console.log('[MAP] Loaded');
      setTimeout(() => { try { map.resize(); } catch(e){} }, 100);
      loadMarkersFromData();
      if (kmlDataCache) applyLineFilters();
      else if (db) {
        db.ref('kmlData').once('value').then(s => {
          kmlDataCache = s.val() || {};
          applyLineFilters();
        }).catch(err => console.warn('[KML] load error:', err));
      }
    });
    map.on('error', e => console.error('[MAP ERROR]', e));
    map.on('click', e => {
      console.log('[MAP CLICK] drawMode:', drawMode);
      if (drawMode) handleDrawClick(e);
    });
  } catch (e) {
    console.error('Map init:', e);
    showToast('Gagal inisialisasi peta: ' + e.message, 'error');
  }
}

/* ============================================================ MARKERS ============================================================ */
function loadMarkersFromData() {
  if (!map || !db) return;
  markers.forEach(m => { try { m.remove(); } catch(e){} });
  markers = [];
  db.ref('data').once('value').then(snap => {
    const appData = snap.val() || {};
    let totalMarkers = 0;

    POINT_CATEGORIES.forEach(cat => {
      const items = appData[cat.key] || {};
      Object.keys(items).forEach(k => {
        const it = items[k];
        let lat = null, lng = null;

        if (it.coords) {
          const parts = String(it.coords).split(',').map(x => x.trim());
          if (parts.length >= 2) {
            lat = parseFloat(parts[0]);
            lng = parseFloat(parts[1]);
          }
        }
        if (isNaN(lat) || isNaN(lng)) {
          lat = parseFloat(it.lat || it.latitude || '');
          lng = parseFloat(it.lng || it.lon || it.longitude || '');
        }

        if (lat !== null && lng !== null && !isNaN(lat) && !isNaN(lng) && lat !== 0 && lng !== 0) {
          const el = document.createElement('div');
          el.className = 'ml-marker';
          el.style.cssText = 'width:14px;height:14px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 8px ' + cat.color + ',0 2px 4px rgba(0,0,0,0.4);cursor:pointer;background:' + cat.color + ';';
          const popup = new maplibregl.Popup({ offset: 14, closeButton: true, maxWidth: '230px' })
            .setHTML(buildMarkerPopup(cat.key, it, cat.color));
          const marker = new maplibregl.Marker({ element: el, anchor: 'center' })
            .setLngLat([lng, lat])
            .setPopup(popup)
            .addTo(map);
          markers.push(marker);
          totalMarkers++;
        }
      });
    });
    console.log('[MAP] Total markers:', totalMarkers);
    updateMapLegendCounts(appData);
  }).catch(err => console.error('[MAP] markers error:', err));
}
function buildMarkerPopup(cat, it, color) {
  const row = (label, val, c) => (val === undefined || val === null || val === '') ? '' : '<div style="color:#94A3B8;font-weight:700;font-size:9px;">' + label + '</div><div style="color:' + (c || '#E2E8F0') + ';font-weight:600;word-break:break-word;font-size:10px;">' + escapeHtml(String(val)) + '</div>';
  let rows = row('Kategori', cat, color) + row('Tanggal', it.date) + row('Lokasi', it.location);
  if (it.keterangan) rows += row('Keterangan', it.keterangan);
  return '<div style="min-width:150px;max-width:220px;display:grid;grid-template-columns:auto 1fr;gap:2px 8px;font-size:10px;line-height:1.3;">' + rows + '</div>';
}
function updateMapLegendCounts(appData) {
  const count = cat => Object.keys((appData && appData[cat]) || {}).length;
  document.getElementById('ml-count-ofcut').textContent = count('Data OF Cut');
  document.getElementById('ml-count-p3').textContent = count('Pekerjaan Pihak Ke-3');
  document.getElementById('ml-count-temuan').textContent = count('Temuan Lapangan');
  document.getElementById('ml-count-joint').textContent = count('Joint');
  document.getElementById('ml-count-handhole').textContent = count('Handhole');
}

/* ============================================================ MAP LAYER SWITCH ============================================================ */
window.toggleMapLayer = function(type, evt) {
  if (!map) return;
  let style;
  if (type === 'street') style = getStreetStyle();
  else if (type === 'hybrid') style = getHybridStyle();
  else style = getSatelliteStyle();
  markers.forEach(m => { try { m.remove(); } catch(e) {} });
  markers = [];
  kmlLayers = {};
  map.setStyle(style);
  map.once('idle', () => {
    loadMarkersFromData();
    setTimeout(() => { if (map && map.isStyleLoaded()) applyLineFilters(); }, 150);
  });
  document.querySelectorAll('.custom-map-btn').forEach(b => b.classList.remove('active'));
  if (evt && evt.currentTarget) evt.currentTarget.classList.add('active');
};

/* ============================================================ PANELS ============================================================ */
window.toggleUploadPanel = function() {
  const p = document.getElementById('upload-panel');
  const dp = document.getElementById('draw-panel');
  if (!p || !dp) return;
  dp.classList.remove('show');
  p.classList.toggle('show');
  if (p.classList.contains('show')) updateKmlCustomLineOptions();
};
window.toggleDrawPanel = function() {
  const p = document.getElementById('draw-panel');
  const up = document.getElementById('upload-panel');
  if (!p || !up) return;
  up.classList.remove('show');
  p.classList.toggle('show');
  if (p.classList.contains('show')) updateDrawCustomLineOptions();
};

document.getElementById('kml-line').addEventListener('change', function() {
  document.getElementById('kml-custom-line-wrap').classList.toggle('hidden', this.value !== '__custom__');
});
document.getElementById('draw-line-name').addEventListener('change', function() {
  document.getElementById('draw-custom-line-wrap').classList.toggle('hidden', this.value !== '__custom__');
});
document.getElementById('draw-line-color').addEventListener('input', function() {
  document.getElementById('draw-color-preview').textContent = this.value;
});
document.getElementById('kml-file').addEventListener('change', function() {
  document.getElementById('btn-kml-submit').disabled = !this.files[0];
  document.getElementById('kml-info').textContent = this.files[0] ? ('File siap: ' + this.files[0].name) : 'Pilih line & file dulu';
  document.getElementById('kml-info').className = this.files[0] ? 'info-count success' : 'info-count';
});

/* ============================================================ KML UPLOAD ============================================================ */
window.submitKmlUpload = function() {
  let lineName = document.getElementById('kml-line').value;
  if (lineName === '__custom__') {
    lineName = (document.getElementById('kml-custom-line-name').value || '').trim().toUpperCase();
    if (!lineName) { showToast('Isi nama line baru', 'error'); return; }
  }
  if (!lineName) { showToast('Pilih line', 'error'); return; }
  const file = document.getElementById('kml-file').files[0];
  if (!file) { showToast('Pilih file dulu', 'error'); return; }
  const info = document.getElementById('kml-info');
  info.textContent = 'Memproses...';
  info.className = 'info-count';
  document.getElementById('btn-kml-submit').disabled = true;

  const isKMZ = file.name.toLowerCase().endsWith('.kmz');
  const reader = new FileReader();
  reader.onerror = () => { showToast('Gagal baca file', 'error'); document.getElementById('btn-kml-submit').disabled = false; };
  reader.onload = ev => {
    if (isKMZ) {
      JSZip.loadAsync(ev.target.result).then(zip => {
        let kmlEntry = null;
        zip.forEach((p, e) => { if (!kmlEntry && !e.dir && p.toLowerCase().endsWith('.kml')) kmlEntry = e; });
        if (!kmlEntry) throw new Error('KMZ tidak berisi KML');
        return kmlEntry.async('string');
      }).then(text => processKmlAndSave(text, lineName))
        .catch(err => { showToast('Gagal: ' + err.message, 'error'); document.getElementById('btn-kml-submit').disabled = false; });
    } else {
      processKmlAndSave(ev.target.result, lineName).catch(err => { showToast('Gagal: ' + err.message, 'error'); document.getElementById('btn-kml-submit').disabled = false; });
    }
  };
  if (isKMZ) reader.readAsArrayBuffer(file);
  else reader.readAsText(file);
};

function processKmlAndSave(kmlText, lineName) {
  return new Promise((resolve, reject) => {
    console.log('[KML] Proses line:', lineName, '| length:', kmlText.length);
    if (!kmlText || typeof kmlText !== 'string') return reject(new Error('KML tidak valid'));

    const xml = new DOMParser().parseFromString(kmlText, 'text/xml');
    if (xml.querySelector('parsererror')) return reject(new Error('XML tidak valid'));

    let allCoords = [];

    const pms = xml.getElementsByTagName('Placemark');
    console.log('[KML] Placemark count:', pms.length);

    for (let i = 0; i < pms.length; i++) {
      const ls = pms[i].getElementsByTagName('LineString')[0];
      if (!ls) continue;
      const c = ls.getElementsByTagName('coordinates')[0];
      if (!c) continue;
      const coords = c.textContent.trim().split(/\s+/)
        .map(x => {
          const a = x.split(',');
          return [parseFloat(a[0]), parseFloat(a[1])];
        })
        .filter(x => !isNaN(x[0]) && !isNaN(x[1]));
      allCoords = allCoords.concat(coords);
    }

    // Fallback: cari semua tag coordinates
    if (allCoords.length < 2) {
      const allCoordTags = xml.getElementsByTagName('coordinates');
      for (let i = 0; i < allCoordTags.length; i++) {
        const coords = allCoordTags[i].textContent.trim().split(/\s+/)
          .map(x => {
            const a = x.split(',');
            return [parseFloat(a[0]), parseFloat(a[1])];
          })
          .filter(x => !isNaN(x[0]) && !isNaN(x[1]));
        allCoords = allCoords.concat(coords);
      }
    }

    console.log('[KML] Total coords ditemukan:', allCoords.length);
    if (allCoords.length < 2) return reject(new Error('Koordinat kurang dari 2 titik'));

    const kmlForLine = generateKmlFromCoords(allCoords, lineName, '');
    db.ref('kmlData/' + lineName).set(kmlForLine).then(() => {
      showToast('✅ Line "' + lineName + '" tersimpan', 'success');
      document.getElementById('kml-info').textContent = '✓ Berhasil disimpan';
      document.getElementById('kml-info').className = 'info-count success';
      setTimeout(() => {
        document.getElementById('upload-panel').classList.remove('show');
        document.getElementById('kml-file').value = '';
        document.getElementById('btn-kml-submit').disabled = true;
        document.getElementById('kml-info').textContent = 'Pilih line & file dulu';
        document.getElementById('kml-info').className = 'info-count';
      }, 1200);
      resolve();
    }).catch(reject);
  });
}

function generateKmlFromCoords(coords, name, notes) {
  const coordsStr = coords.map(p => p[0] + ',' + p[1] + ',0').join(' ');
  const desc = notes ? '<description><![CDATA[' + notes + ']]></description>' : '';
  return '<?xml version="1.0" encoding="UTF-8"?>\n<kml xmlns="http://www.opengis.net/kml/2.2">\n<Document>\n<name>' + escapeXml(name) + '</name>\n<Placemark>\n<name>' + escapeXml(name) + '</name>\n' + desc + '<LineString><tessellate>1</tessellate><coordinates>' + coordsStr + '</coordinates></LineString>\n</Placemark>\n</Document>\n</kml>';
}

/* ============================================================ KML LOAD & DRAW ============================================================ */
function loadKmlFromFirebase() {
  if (!db) return;
  db.ref('kmlData').on('value', s => {
    kmlDataCache = s.val() || {};
    if (map && map.isStyleLoaded()) applyLineFilters();
    else if (map) map.once('idle', applyLineFilters);
  });
  db.ref('customLines').on('value', s => {
    customLines = s.val() || {};
    updateKmlCustomLineOptions();
    updateDrawCustomLineOptions();
  });
}

function applyLineFilters() {
  if (!map || !map.isStyleLoaded()) { setTimeout(applyLineFilters, 300); return; }
  const d = kmlDataCache || {};
  Object.keys(kmlLayers).forEach(name => {
    if (!d[name]) {
      const l = kmlLayers[name];
      try { if (l.layerId && map.getLayer(l.layerId)) map.removeLayer(l.layerId); } catch(e) {}
      try { if (l.sourceId && map.getSource(l.sourceId)) map.removeSource(l.sourceId); } catch(e) {}
      delete kmlLayers[name];
    }
  });
  Object.keys(d).forEach(name => {
    if (kmlLayers[name]) return;
    const kmlText = d[name];
    if (!kmlText || typeof kmlText !== 'string') return;
    try {
      const xml = new DOMParser().parseFromString(kmlText, 'text/xml');
      const geojson = parseKmlToGeoJSON(xml);
      if (geojson.features.length > 0) drawKmlGeoJSON(name, geojson, false);
    } catch(e) {}
  });
  renderMapLineLegend();
}

function parseKmlToGeoJSON(xml) {
  const features = [];
  try {
    const pms = xml.getElementsByTagName('Placemark');
    for (let i = 0; i < pms.length; i++) {
      const pm = pms[i];
      const nameEl = pm.getElementsByTagName('name')[0];
      const name = nameEl && nameEl.textContent ? nameEl.textContent : '';
      const ls = pm.getElementsByTagName('LineString')[0];
      if (!ls) continue;
      const c = ls.getElementsByTagName('coordinates')[0];
      if (!c) continue;
      const coords = c.textContent.trim().split(/\s+/).map(x => { const a = x.split(','); return [parseFloat(a[0]), parseFloat(a[1])]; }).filter(x => !isNaN(x[0]) && !isNaN(x[1]));
      if (coords.length > 1) features.push({ type: 'Feature', properties: { name }, geometry: { type: 'LineString', coordinates: coords } });
    }
  } catch(e) {}
  return { type: 'FeatureCollection', features };
}

function drawKmlGeoJSON(lineName, geojson, autoZoom) {
  if (!map || !geojson) return;
  if (!map.isStyleLoaded()) { map.once('styledata', () => drawKmlGeoJSON(lineName, geojson, autoZoom)); return; }
  let color = kmlLineColors[lineName] || '#00D9FF';
  if (customLines[lineName] && customLines[lineName].color) color = customLines[lineName].color;
  let width = 4;
  if (customLines[lineName] && customLines[lineName].width) width = customLines[lineName].width;
  const safe = lineName.replace(/\s+/g, '-').toLowerCase().replace(/[^a-z0-9-]/g, '');
  const sourceId = 'kml-src-' + safe;
  const layerId = 'kml-layer-' + safe;
  try { if (map.getLayer(layerId)) map.removeLayer(layerId); } catch(e) {}
  try { if (map.getSource(sourceId)) map.removeSource(sourceId); } catch(e) {}
  try {
    map.addSource(sourceId, { type: 'geojson', data: geojson });
    map.addLayer({
      id: layerId, type: 'line', source: sourceId,
      layout: { 'line-join': 'round', 'line-cap': 'round' },
      paint: { 'line-color': color, 'line-width': width, 'line-opacity': 0.85 }
    });
  } catch(e) {}
  kmlLayers[lineName] = { sourceId, layerId, geojson };
  if (autoZoom !== false && geojson.features && geojson.features.length > 0) {
    try {
      const bounds = new maplibregl.LngLatBounds();
      geojson.features.forEach(f => f.geometry.coordinates.forEach(c => bounds.extend(c)));
      if (!bounds.isEmpty()) map.fitBounds(bounds, { padding: 40, maxZoom: 16 });
    } catch(e) {}
  }
  renderMapLineLegend();
}

function renderMapLineLegend() {
  const section = document.getElementById('ml-line-section');
  const listEl = document.getElementById('ml-line-list');
  if (!section || !listEl) return;
  const activeLines = Object.keys(kmlLayers || {});
  if (activeLines.length === 0) { section.style.display = 'none'; listEl.innerHTML = ''; return; }
  activeLines.sort();
  listEl.innerHTML = activeLines.map(name => {
    const color = kmlLineColors[name] || (customLines[name] && customLines[name].color) || '#00D9FF';
    return '<div class="ml-line-item" title="' + escapeHtml(name) + '"><span class="ml-line-bar" style="background:' + color + ';"></span><span class="ml-line-name">' + escapeHtml(name) + '</span></div>';
  }).join('');
  section.style.display = 'block';
}

/* ============================================================ DRAW LINE ============================================================ */
window.startDrawing = function() {
  console.log('[DRAW] startDrawing dipanggil');
  if (!map) { showToast('Peta belum siap', 'error'); return; }

  let lineName = document.getElementById('draw-line-name').value;
  if (lineName === '__custom__') {
    lineName = (document.getElementById('draw-custom-line-name').value || '').trim().toUpperCase();
    if (!lineName) { showToast('Isi nama line', 'error'); return; }
  }
  if (!lineName) { showToast('Pilih line dulu', 'error'); return; }

  const color = document.getElementById('draw-line-color').value;
  const width = parseInt(document.getElementById('draw-line-width').value) || 4;
  const notes = (document.getElementById('draw-line-notes').value || '').trim().toUpperCase();

  drawCurrentLine = {
    name: lineName, color, width, notes,
    isCustom: document.getElementById('draw-line-name').value === '__custom__'
  };
  drawMode = true;
  drawPoints = [];
  drawMarkers.forEach(m => { try { m.remove(); } catch(e){} });
  drawMarkers = [];

  document.getElementById('draw-panel').classList.remove('show');
  document.getElementById('draw-controls').classList.add('show');
  document.getElementById('draw-point-count').textContent = '0 titik';
  document.body.classList.add('draw-cursor-active');

  console.log('[DRAW] Mode AKTIF untuk line:', lineName);
  showToast('Mode menggambar aktif — klik di peta', 'success');
};

function handleDrawClick(e) {
  if (!drawMode) return;
  const lng = e.lngLat.lng, lat = e.lngLat.lat;
  drawPoints.push([lng, lat]);
  console.log('[DRAW] Titik ditambah:', drawPoints.length);

  const el = document.createElement('div');
  el.className = 'draw-point';
  if (drawPoints.length === 1) el.classList.add('first');
  else {
    const prev = drawMarkers[drawMarkers.length - 1];
    if (prev) prev.getElement().classList.remove('last');
    el.classList.add('last');
  }
  const marker = new maplibregl.Marker({ element: el, anchor: 'center' })
    .setLngLat([lng, lat])
    .addTo(map);
  drawMarkers.push(marker);
  updateDrawPreview();
  document.getElementById('draw-point-count').textContent = drawPoints.length + ' titik';
}

function updateDrawPreview() {
  if (!map || drawPoints.length < 2) return;
  const geojson = { type: 'Feature', properties: {}, geometry: { type: 'LineString', coordinates: drawPoints } };
  const srcId = 'draw-preview-src', layId = 'draw-preview-lay';
  try { if (map.getLayer(layId)) map.removeLayer(layId); } catch(e) {}
  try { if (map.getSource(srcId)) map.removeSource(srcId); } catch(e) {}
  map.addSource(srcId, { type: 'geojson', data: geojson });
  map.addLayer({ id: layId, type: 'line', source: srcId, layout: { 'line-join': 'round', 'line-cap': 'round' }, paint: { 'line-color': drawCurrentLine.color, 'line-width': drawCurrentLine.width, 'line-opacity': 0.85, 'line-dasharray': [2, 1] } });
}

window.undoLastPoint = function() {
  if (drawPoints.length === 0) { showToast('Tidak ada titik', 'error'); return; }
  drawPoints.pop();
  const m = drawMarkers.pop();
  if (m) m.remove();
  drawMarkers.forEach((mk, i) => {
    const el = mk.getElement();
    el.classList.remove('first', 'last');
    if (i === 0) el.classList.add('first');
    if (i === drawMarkers.length - 1 && drawMarkers.length > 1) el.classList.add('last');
  });
  if (drawPoints.length < 2) {
    try { if (map.getLayer('draw-preview-lay')) map.removeLayer('draw-preview-lay'); } catch(e) {}
    try { if (map.getSource('draw-preview-src')) map.removeSource('draw-preview-src'); } catch(e) {}
  } else updateDrawPreview();
  document.getElementById('draw-point-count').textContent = drawPoints.length + ' titik';
};

window.cancelDrawLine = function() {
  if (drawPoints.length > 0 && !confirm('Batalkan gambar?')) return;
  cleanupDrawing();
  showToast('Dibatalkan', 'info');
};

function cleanupDrawing() {
  drawMode = false;
  drawPoints = [];
  drawMarkers.forEach(m => m.remove());
  drawMarkers = [];
  try { if (map.getLayer('draw-preview-lay')) map.removeLayer('draw-preview-lay'); } catch(e) {}
  try { if (map.getSource('draw-preview-src')) map.removeSource('draw-preview-src'); } catch(e) {}
  document.getElementById('draw-controls').classList.remove('show');
  document.body.classList.remove('draw-cursor-active');
  drawCurrentLine = null;
}

window.finishDrawLine = function() {
  if (drawPoints.length < 2) { showToast('Minimal 2 titik', 'error'); return; }
  const { name, color, width, notes, isCustom } = drawCurrentLine;
  const customSavePromise = (isCustom && !customLines[name])
    ? db.ref('customLines/' + name).set({ color, width, createdAt: Date.now(), notes })
    : Promise.resolve();
  const kmlText = generateKmlFromCoords(drawPoints, name, notes);
  customSavePromise
    .then(() => db.ref('kmlData/' + name).set(kmlText))
    .then(() => {
      showToast('Line "' + name + '" tersimpan!', 'success');
      cleanupDrawing();
    })
    .catch(err => showToast('Gagal: ' + err.message, 'error'));
};

/* ============================================================ KML MANAGER ============================================================ */
window.openKmlManager = function() {
  document.getElementById('kml-manager-modal').classList.remove('hidden');
  document.getElementById('kml-list-search').value = '';
  renderKmlManagerList();
};
window.closeKmlManager = function() {
  document.getElementById('kml-manager-modal').classList.add('hidden');
};
window.renderKmlManagerList = function() {
  const container = document.getElementById('kml-list-container');
  const countBadge = document.getElementById('kml-count-badge');
  if (!container) return;
  const data = kmlDataCache || {};
  let names = Object.keys(data).sort();
  const search = (document.getElementById('kml-list-search')?.value || '').toLowerCase();
  if (countBadge) countBadge.textContent = names.length;
  if (search) names = names.filter(n => n.toLowerCase().includes(search));
  if (names.length === 0) {
    container.innerHTML = '<div style="padding:30px;text-align:center;color:var(--text-muted);">' + (search ? 'Tidak ada line cocok' : 'Belum ada line tersimpan') + '</div>';
    return;
  }
  container.innerHTML = names.map(name => {
    const kmlText = data[name] || '';
    let pmCount = 0;
    try { const xml = new DOMParser().parseFromString(kmlText, 'text/xml'); pmCount = xml.getElementsByTagName('Placemark').length; } catch(e) {}
    const isBuiltin = BUILTIN_LINES.indexOf(name) !== -1;
    const color = kmlLineColors[name] || (customLines[name] && customLines[name].color) || '#00D9FF';
    return '<div class="kml-list-item">' +
      '<div style="width:40px;height:40px;border-radius:10px;background:' + color + '20;border:1px solid ' + color + '80;display:grid;place-items:center;flex-shrink:0;">▬</div>' +
      '<div class="kml-list-info"><div class="kml-list-name">' + escapeHtml(name) + (isBuiltin ? '' : ' <span style="font-size:11px;color:var(--primary-cyan);">(kustom)</span>') + '</div>' +
      '<div style="font-size:11px;color:var(--text-muted);">' + pmCount + ' placemark • ' + (kmlText.length / 1024).toFixed(1) + ' KB</div></div>' +
      '<div class="kml-list-actions">' +
      '<button class="kml-list-btn download" onclick="downloadSingleKml(\'' + escapeHtml(name).replace(/'/g, "\\'") + '\')">KML</button>' +
      '<button class="kml-list-btn download" onclick="downloadSingleKmz(\'' + escapeHtml(name).replace(/'/g, "\\'") + '\')">KMZ</button>' +
      '<button class="kml-list-btn delete" onclick="hapusLineKml(\'' + escapeHtml(name).replace(/'/g, "\\'") + '\')">Hapus</button>' +
      '</div></div>';
  }).join('');
};

window.downloadSingleKml = function(lineName) {
  const kmlText = (kmlDataCache || {})[lineName];
  if (!kmlText) { showToast('Tidak ada', 'error'); return; }
  downloadTextAsFile(kmlText, lineName + '.kml', 'application/vnd.google-earth.kml+xml');
  showToast('KML diunduh', 'success');
};
window.downloadSingleKmz = function(lineName) {
  const kmlText = (kmlDataCache || {})[lineName];
  if (!kmlText) { showToast('Tidak ada', 'error'); return; }
  const zip = new JSZip();
  zip.file('doc.kml', kmlText);
  zip.generateAsync({ type: 'blob' }).then(blob => {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = lineName + '.kmz';
    document.body.appendChild(a); a.click();
    document.body.removeChild(a); URL.revokeObjectURL(url);
    showToast('KMZ diunduh', 'success');
  });
};
window.hapusLineKml = function(lineName) {
  if (!confirm('HAPUS line "' + lineName + '"?')) return;
  const isBuiltin = BUILTIN_LINES.indexOf(lineName) !== -1;
  const chain = isBuiltin ? Promise.resolve() : db.ref('customLines/' + lineName).remove().catch(() => {});
  chain.then(() => db.ref('kmlData/' + lineName).remove()).then(() => {
    delete kmlDataCache[lineName];
    showToast('Line dihapus', 'success');
    renderKmlManagerList();
  }).catch(err => showToast(err.message, 'error'));
};

function downloadTextAsFile(text, filename, mimeType) {
  const blob = new Blob([text], { type: mimeType || 'text/plain' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click();
  document.body.removeChild(a); URL.revokeObjectURL(url);
}

/* ============================================================ CUSTOM LINE OPTIONS ============================================================ */
function updateKmlCustomLineOptions() {
  const sel = document.getElementById('kml-line');
  if (!sel) return;
  Array.from(sel.options).forEach(opt => { if (opt.value && BUILTIN_LINES.indexOf(opt.value) === -1 && opt.value !== '__custom__') opt.remove(); });
  const customOpt = sel.querySelector('option[value="__custom__"]');
  Object.keys(customLines).forEach(key => {
    if (!sel.querySelector('option[value="' + key + '"]')) {
      const opt = document.createElement('option');
      opt.value = key; opt.textContent = key + ' (kustom)';
      sel.insertBefore(opt, customOpt);
    }
  });
}
function updateDrawCustomLineOptions() {
  const sel = document.getElementById('draw-line-name');
  if (!sel) return;
  Array.from(sel.options).forEach(opt => { if (opt.value && BUILTIN_LINES.indexOf(opt.value) === -1 && opt.value !== '__custom__') opt.remove(); });
  const customOpt = sel.querySelector('option[value="__custom__"]');
  Object.keys(customLines).forEach(key => {
    if (!sel.querySelector('option[value="' + key + '"]')) {
      const opt = document.createElement('option');
      opt.value = key; opt.textContent = key + ' (kustom)';
      sel.insertBefore(opt, customOpt);
    }
  });
}

/* ============================================================ INIT ============================================================ */
document.addEventListener('DOMContentLoaded', () => {
  console.log('[BUCIN] DOMContentLoaded');
  if (typeof lucide !== 'undefined') lucide.createIcons();

  const btnDraw = document.getElementById('btn-draw-line');
  if (btnDraw) btnDraw.onclick = (e) => { e.preventDefault(); toggleDrawPanel(); };

  const btnUpload = document.getElementById('btn-upload-kml');
  if (btnUpload) btnUpload.onclick = (e) => { e.preventDefault(); toggleUploadPanel(); };

  const btnManage = document.getElementById('btn-manage-kml');
  if (btnManage) btnManage.onclick = (e) => { e.preventDefault(); openKmlManager(); };

  initMap();
  loadKmlFromFirebase();

  window.addEventListener('resize', () => { if (map) map.resize(); });
  console.log('[BUCIN] Siap');
});
</script>
