<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maps - BUCIN (OpenLayers + Cesium)</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@9.2.4/ol.css" />
    <script src="https://cdn.jsdelivr.net/npm/ol@9.2.4/dist/ol.js"></script>

    <!-- CesiumJS -->
    <script src="https://cesium.com/downloads/cesiumjs/releases/1.113/Build/Cesium/Cesium.js"></script>
    <link href="https://cesium.com/downloads/cesiumjs/releases/1.113/Build/Cesium/Widgets/widgets.css" rel="stylesheet">

    <!-- ol-cesium -->
    <script src="https://cdn.jsdelivr.net/npm/ol-cesium@2.17.0/dist/olcesium.min.js"></script>

    <script src="https://unpkg.com/@tmcw/togeojson@5.8.1/dist/togeojson.umd.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

    <style>
        * { box-sizing: border-box; }
        html, body {
            margin: 0; padding: 0;
            height: 100%;
            font-family: 'Poppins', sans-serif;
            background: #0f172a;
            overflow: hidden;
        }
        #map { width: 100%; height: 100%; background: #0f172a; position: relative; }

        /* ============ HEADER ============ */
        .maps-header {
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 44px;
            z-index: 1000;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 12px;
            background: rgba(15, 23, 42, 0.92);
            border-bottom: 1px solid rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(8px);
        }
        .maps-header .header-title {
            font-size: 12px; font-weight: 800; color: #38bdf8;
            display: flex; align-items: center; gap: 6px;
            margin-right: 8px; flex-shrink: 0;
        }
        .maps-header .header-title i { color: #f43f5e; font-size: 12px; }
        .maps-header .header-title span { color: #e2e8f0; font-weight: 600; font-size: 11px; }

        .header-btn {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.25);
            color: #e2e8f0;
            padding: 5px 10px;
            border-radius: 6px;
            font-size: 11px; font-weight: 700;
            cursor: pointer; font-family: 'Poppins', sans-serif;
            display: inline-flex; align-items: center; gap: 5px;
            white-space: nowrap;
        }
        .header-btn:hover { color: #38bdf8; border-color: #38bdf8; }
        .header-btn.primary { color: #10b981; border-color: rgba(16, 185, 129, 0.6); }
        .header-btn.danger { color: #f43f5e; border-color: rgba(244, 63, 94, 0.6); }

        .map-mode-btn {
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #94a3b8;
            padding: 5px 9px;
            border-radius: 6px;
            font-size: 10px; font-weight: 700;
            cursor: pointer; font-family: 'Poppins', sans-serif;
            display: inline-flex; align-items: center; gap: 4px;
        }
        .map-mode-btn:hover { color: #38bdf8; border-color: #38bdf8; }
        .map-mode-btn.active {
            color: #38bdf8;
            border-color: #38bdf8;
            background: rgba(56, 189, 248, 0.15);
        }

        .header-info {
            display: none; align-items: center; gap: 6px;
            padding: 4px 10px;
            background: rgba(16, 185, 129, 0.12);
            border: 1px solid rgba(16, 185, 129, 0.4);
            border-radius: 6px;
            font-size: 10px; font-weight: 700; color: #10b981;
            margin-left: auto;
        }
        .header-info.show { display: inline-flex; }
        .header-info .info-name { color: #fff; font-weight: 600; max-width: 180px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .header-info button { background: transparent; border: none; color: #94a3b8; cursor: pointer; font-size: 11px; padding: 0; }

        /* ============ LEGENDA ============ */
        .map-legend {
            position: absolute;
            top: 54px; left: 10px;
            background: rgba(15, 23, 42, 0.88);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 7px;
            padding: 6px 8px;
            z-index: 900;
            font-size: 9.5px; color: #e2e8f0;
            max-width: 175px;
            max-height: calc(100vh - 70px);
            overflow-y: auto;
            backdrop-filter: blur(6px);
        }
        .map-legend h5 { font-size: 9px; color: #38bdf8; margin: 0 0 5px 0; text-transform: uppercase; letter-spacing: 0.5px; font-weight: 800; display: flex; align-items: center; gap: 4px; }
        .map-legend .section-title { font-size: 8px; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.5px; font-weight: 800; margin: 5px 0 3px 0; padding-top: 4px; border-top: 1px dashed rgba(255,255,255,0.15); }
        .map-legend .li { display: flex; align-items: center; gap: 5px; color: #e2e8f0; padding: 2px 0; cursor: pointer; user-select: none; line-height: 1.2; }
        .map-legend .li:hover { opacity: 0.8; }
        .map-legend .li.off { opacity: 0.3; text-decoration: line-through; }
        .map-legend .li i { font-size: 8px; width: 10px; text-align: center; flex-shrink: 0; }
        .map-legend .li span.count { margin-left: auto; font-weight: 700; color: #38bdf8; font-size: 9px; }
        .map-legend .li span.label-text { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }

        /* ============ POPUP ============ */
        .ol-popup {
            position: absolute;
            background: rgba(15, 23, 42, 0.98);
            color: #fff;
            border: 1px solid #38bdf8;
            border-radius: 10px;
            padding: 10px 12px;
            font-size: 11px;
            min-width: 180px;
            max-width: 300px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.6);
            bottom: 12px;
            left: -50%;
            transform: translateX(-50%);
            z-index: 950;
        }
        .ol-popup::after {
            content: '';
            position: absolute;
            bottom: -8px;
            left: 50%;
            transform: translateX(-50%);
            border-width: 8px 8px 0 8px;
            border-style: solid;
            border-color: rgba(15, 23, 42, 0.98) transparent transparent transparent;
        }
        .ol-popup-closer { position: absolute; top: 4px; right: 6px; font-size: 14px; color: #94a3b8; cursor: pointer; text-decoration: none; font-weight: bold; line-height: 1; }
        .ol-popup-closer:hover { color: #f43f5e; }
        .popup-title { font-size: 12px; font-weight: 800; margin-bottom: 5px; display: flex; align-items: center; gap: 5px; }
        .popup-row { font-size: 11px; color: #cbd5e1; line-height: 1.5; }
        .popup-row b { color: #fff; }
        .popup-badge { display: inline-block; padding: 1px 7px; border-radius: 8px; font-size: 9px; font-weight: 700; margin-top: 5px; }

        /* ============ TOAST ============ */
        .kml-toast {
            position: absolute; bottom: 20px; left: 50%;
            transform: translateX(-50%) translateY(20px);
            z-index: 1100;
            background: rgba(15, 23, 42, 0.95);
            border: 1px solid rgba(56, 189, 248, 0.5);
            color: #fff; padding: 8px 16px; border-radius: 8px;
            font-size: 12px; font-weight: 600;
            display: flex; align-items: center; gap: 8px;
            opacity: 0; pointer-events: none; transition: all 0.3s ease;
        }
        .kml-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
        .kml-toast.success { border-color: rgba(16, 185, 129, 0.6); }
        .kml-toast.error { border-color: rgba(244, 63, 94, 0.6); }

        /* ============ TOMBOL ZOOM CUSTOM (HTML fallback) ============ */
        .custom-zoom {
            position: absolute;
            top: 54px; right: 10px;
            z-index: 900;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .custom-zoom button {
            width: 32px; height: 32px;
            background: rgba(15, 23, 42, 0.92);
            color: #e2e8f0;
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 6px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.2s;
        }
        .custom-zoom button:hover {
            background: rgba(30, 41, 59, 1);
            color: #38bdf8;
            border-color: #38bdf8;
        }

        /* Sembunyikan zoom control bawaan OL supaya tidak dobel */
        .ol-zoom { display: none !important; }

        .ol-attribution { font-size: 10px !important; background: rgba(15, 23, 42, 0.8) !important; border-radius: 4px !important; }
        .ol-attribution a { color: #38bdf8 !important; }
        .ol-attribution button { background: rgba(15, 23, 42, 0.9) !important; color: #e2e8f0 !important; border: none !important; }

        /* Sembunyikan credit Cesium default */
        .cesium-widget-credits { display: none !important; }

        @media (max-width: 640px) {
            .maps-header { padding: 4px 8px; gap: 5px; height: 40px; }
            .maps-header .header-title span { display: none; }
            .header-btn span, .map-mode-btn span { display: none; }
            .header-info { display: none !important; }
            .map-legend { top: 48px; left: 6px; font-size: 8.5px; max-width: 140px; }
            .custom-zoom { top: 48px; right: 6px; }
        }
    </style>
</head>
<body>

    <div id="map"></div>

    <!-- ===== HEADER ===== -->
    <div class="maps-header">
        <div class="header-title">
            <i class="fa-solid fa-map"></i>
            <span>Peta Insiden Jaringan</span>
        </div>

        <button class="map-mode-btn active" onclick="setMapMode('standard')" id="btnModeStandard" title="2D Standard">
            <i class="fa-solid fa-map"></i> <span>Standard</span>
        </button>
        <button class="map-mode-btn" onclick="setMapMode('satellite')" id="btnModeSatellite" title="Satellite">
            <i class="fa-solid fa-satellite"></i> <span>Satelit</span>
        </button>
        <button class="map-mode-btn" onclick="setMapMode('globe3d')" id="btnModeGlobe" title="3D Globe">
            <i class="fa-solid fa-globe"></i> <span>3D</span>
        </button>

        <button class="header-btn primary" onclick="uploadKML()" title="Upload KML/KMZ">
            <i class="fa-solid fa-cloud-arrow-up"></i> <span>Upload</span>
        </button>
        <button class="header-btn danger" onclick="clearKML()" title="Clear KML">
            <i class="fa-solid fa-trash"></i> <span>Clear</span>
        </button>
        <div class="header-info" id="headerInfo">
            <i class="fa-solid fa-file-import"></i>
            <span class="info-name" id="headerInfoName">-</span>
            <button onclick="clearKML()" title="Tutup"><i class="fa-solid fa-xmark"></i></button>
        </div>
    </div>

    <input type="file" id="kmlFileInput" accept=".kml,.kmz" style="display:none;">

    <!-- ===== LEGENDA ===== -->
    <div class="map-legend">
        <h5><i class="fa-solid fa-list"></i> Legenda</h5>
        <div class="section-title">Data Input</div>
        <div class="li" data-toggle="marker" data-kat="focut">
            <i class="fa-solid fa-scissors" style="color:#f43f5e;"></i>
            <span class="label-text">FO Cut</span>
            <span class="count" id="cntFocut">0</span>
        </div>
        <div class="li" data-toggle="marker" data-kat="temuan">
            <i class="fa-solid fa-magnifying-glass" style="color:#10b981;"></i>
            <span class="label-text">Temuan</span>
            <span class="count" id="cntTemuan">0</span>
        </div>
        <div class="li" data-toggle="marker" data-kat="opm">
            <i class="fa-solid fa-wave-square" style="color:#38bdf8;"></i>
            <span class="label-text">OPM/OLS</span>
            <span class="count" id="cntOpm">0</span>
        </div>
        <div class="li" data-toggle="marker" data-kat="joint">
            <i class="fa-solid fa-circle-nodes" style="color:#f59e0b;"></i>
            <span class="label-text">Joint</span>
            <span class="count" id="cntJoint">0</span>
        </div>
        <div class="li" data-toggle="marker" data-kat="handhole">
            <i class="fa-solid fa-box-open" style="color:#a855f7;"></i>
            <span class="label-text">Handhole</span>
            <span class="count" id="cntHandhole">0</span>
        </div>
    </div>

    <!-- ===== ZOOM BUTTONS CUSTOM ===== -->
    <div class="custom-zoom">
        <button onclick="zoomIn()" title="Zoom In"><i class="fa-solid fa-plus"></i></button>
        <button onclick="zoomOut()" title="Zoom Out"><i class="fa-solid fa-minus"></i></button>
    </div>

    <div class="kml-toast" id="kmlToast"></div>

    <div id="popup" class="ol-popup" style="display:none;">
        <a href="#" id="popup-closer" class="ol-popup-closer">&times;</a>
        <div id="popup-content"></div>
    </div>

    <script src="lines-data.js"></script>

    <script>
        /* ============================================================
           BUCIN MAP - OpenLayers + Cesium (3 Modes)
           ============================================================ */

        /* ⚠️ TOKEN CESIUM — ganti dengan token Anda dari https://ion.cesium.com/tokens
           Jika belum diisi, mode 3D tidak akan aktif. Mode 2D tetap jalan. */
        var CESIUM_TOKEN = 'MASUKKAN_TOKEN_ANDA_DISINI';
        if (CESIUM_TOKEN && CESIUM_TOKEN !== 'MASUKKAN_TOKEN_ANDA_DISINI') {
            Cesium.Ion.defaultAccessToken = CESIUM_TOKEN;
        }

        function getToGeoJSON() {
            return window.toGeoJSON || window.togeojson || null;
        }

        var MANADO_CENTER = [124.8421, 1.4748];
        var MANADO_ZOOM   = 11;

        /* ============================================================
           OPENLAYERS MAP
           ============================================================ */
        var view = new ol.View({
            center: ol.proj.fromLonLat(MANADO_CENTER),
            zoom: MANADO_ZOOM,
            maxZoom: 19,
            minZoom: 3
        });

        /* ============================================================
           BASEMAP LAYERS
           ============================================================ */

        // Mode 1: STANDARD — pakai OSM standar (gratis, tidak kena API key CARTO)
        var baseLayerStandard = new ol.layer.Tile({
            source: new ol.source.OSM({
                url: 'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
                attributions: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
                crossOrigin: 'anonymous'
            }),
            visible: true
        });

        // Mode 2 & 3: SATELLITE — Esri World Imagery
        var baseLayerSatellite = new ol.layer.Tile({
            source: new ol.source.XYZ({
                url: 'https://services.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
                attributions: 'Powered by Esri | Source: Esri, Maxar, Earthstar Geographics',
                crossOrigin: 'anonymous',
                maxZoom: 19
            }),
            visible: false
        });

        // Marker Layer
        var markerSource = new ol.source.Vector();
        var markerLayer = new ol.layer.Vector({
            source: markerSource,
            style: function(feature) {
                var kat = feature.get('kategori');
                var warna = KATEGORI[kat] ? KATEGORI[kat].warna : '#38bdf8';
                return new ol.style.Style({
                    image: new ol.style.Circle({
                        radius: 8,
                        fill: new ol.style.Fill({ color: warna }),
                        stroke: new ol.style.Stroke({ color: '#fff', width: 2 })
                    })
                });
            }
        });

        // KML Layer
        var kmlSource = new ol.source.Vector();
        var kmlLayer = new ol.layer.Vector({
            source: kmlSource,
            style: function(feature) {
                var geomType = feature.getGeometry().getType();
                if (geomType === 'LineString' || geomType === 'MultiLineString') {
                    return new ol.style.Style({ stroke: new ol.style.Stroke({ color: '#38bdf8', width: 3, lineCap: 'round', lineJoin: 'round' }) });
                }
                if (geomType === 'Polygon' || geomType === 'MultiPolygon') {
                    return new ol.style.Style({ stroke: new ol.style.Stroke({ color: '#10b981', width: 2 }), fill: new ol.style.Fill({ color: 'rgba(16, 185, 129, 0.15)' }) });
                }
                return new ol.style.Style({ image: new ol.style.Circle({ radius: 6, fill: new ol.style.Fill({ color: '#38bdf8' }), stroke: new ol.style.Stroke({ color: '#fff', width: 2 }) }) });
            }
        });

        // Buat Map
        var map = new ol.Map({
            target: 'map',
            layers: [baseLayerStandard, baseLayerSatellite, markerLayer, kmlLayer],
            view: view,
            controls: ol.control.defaults.defaults({ attribution: true, zoom: false, rotate: false })
        });

        var attrControl = map.getControls().getArray().find(function(c) { return c instanceof ol.control.Attribution; });
        if (attrControl) attrControl.setPosition('bottom-right');

        /* ============================================================
           ZOOM BUTTONS CUSTOM (karena zoom OL default dimatikan)
           ============================================================ */
        function zoomIn()  { var v = map.getView(); v.animate({ zoom: v.getZoom() + 1, duration: 200 }); }
        function zoomOut() { var v = map.getView(); v.animate({ zoom: v.getZoom() - 1, duration: 200 }); }

        /* ============================================================
           OL-CESIUM 3D GLOBE (Lazy Init)
           ============================================================ */
        var ol3d = null;
        var is3DEnabled = false;
        var cesium3dInitFailed = false;

        function initCesium3D() {
            if (ol3d) return true;
            if (cesium3dInitFailed) return false;

            if (CESIUM_TOKEN === 'MASUKKAN_TOKEN_ANDA_DISINI') {
                showToast('Token Cesium belum diisi. Mode 3D tidak dapat diaktifkan.', 'error');
                cesium3dInitFailed = true;
                return false;
            }

            try {
                ol3d = new olcs.OLCesium({
                    map: map,
                    target: 'map',
                    time: function() { return Cesium.JulianDate.now(); }
                });
                ol3d.setEnabled(false);
                console.log('OL-Cesium initialized');
                return true;
            } catch (e) {
                console.error('Gagal init OL-Cesium:', e);
                showToast('Gagal inisialisasi 3D: ' + e.message, 'error');
                cesium3dInitFailed = true;
                return false;
            }
        }

        /* ============================================================
           MAP MODE SWITCHER
           ============================================================ */
        var currentMode = 'standard';

        function setMapMode(mode) {
            currentMode = mode;

            document.querySelectorAll('.map-mode-btn').forEach(function(btn) { btn.classList.remove('active'); });

            if (mode === 'standard') {
                if (ol3d && is3DEnabled) { ol3d.setEnabled(false); is3DEnabled = false; }
                baseLayerStandard.setVisible(true);
                baseLayerSatellite.setVisible(false);
                document.getElementById('btnModeStandard').classList.add('active');
                showToast('Mode: Standard 2D', 'info');
            }
            else if (mode === 'satellite') {
                if (ol3d && is3DEnabled) { ol3d.setEnabled(false); is3DEnabled = false; }
                baseLayerStandard.setVisible(false);
                baseLayerSatellite.setVisible(true);
                document.getElementById('btnModeSatellite').classList.add('active');
                showToast('Mode: Citra Satelit', 'info');
            }
            else if (mode === 'globe3d') {
                var ok = initCesium3D();
                if (!ok) {
                    // fallback ke satellite jika 3D gagal
                    baseLayerStandard.setVisible(false);
                    baseLayerSatellite.setVisible(true);
                    document.getElementById('btnModeSatellite').classList.add('active');
                    return;
                }
                baseLayerStandard.setVisible(false);
                baseLayerSatellite.setVisible(true);
                ol3d.setEnabled(true);
                is3DEnabled = true;
                document.getElementById('btnModeGlobe').classList.add('active');
                showToast('Mode: Bumi 3D — drag untuk rotate, scroll untuk zoom', 'info');
            }
        }

        /* ============================================================
           KATEGORI & DATA
           ============================================================ */
        var STORAGE_KEY = 'bucin_data';
        var KATEGORI = {
            focut:    { warna: '#f43f5e', label: 'FO Cut',    icon: '✂️' },
            temuan:   { warna: '#10b981', label: 'Temuan',    icon: '🔍' },
            opm:      { warna: '#38bdf8', label: 'OPM / OLS', icon: '📊' },
            joint:    { warna: '#f59e0b', label: 'Joint',     icon: '🔗' },
            handhole: { warna: '#a855f7', label: 'Handhole',  icon: '📦' }
        };

        var markers = [];
        var markersByType = { focut: [], temuan: [], opm: [], joint: [], handhole: [] };
        var markerVisibility = { focut: true, temuan: true, opm: true, joint: true, handhole: true };
        var kmlActiveFile = null;

        /* ============================================================
           POPUP
           ============================================================ */
        var popupContainer = document.getElementById('popup');
        var popupContent   = document.getElementById('popup-content');
        var popupCloser    = document.getElementById('popup-closer');

        var popupOverlay = new ol.Overlay({
            element: popupContainer,
            autoPan: { animation: { duration: 250 } },
            positioning: 'bottom-center',
            offset: [0, -12]
        });
        map.addOverlay(popupOverlay);

        popupCloser.onclick = function() {
            popupOverlay.setPosition(undefined);
            popupContainer.style.display = 'none';
            popupCloser.blur();
            return false;
        };

        function showToast(msg, type) {
            var toast = document.getElementById('kmlToast');
            var icon = type === 'error' ? 'fa-circle-exclamation' : type === 'success' ? 'fa-circle-check' : 'fa-circle-info';
            var color = type === 'error' ? '#f43f5e' : type === 'success' ? '#10b981' : '#38bdf8';
            toast.innerHTML = '<i class="fa-solid ' + icon + '" style="color:' + color + ';"></i> ' + msg;
            toast.className = 'kml-toast show ' + (type || '');
            setTimeout(function() { toast.classList.remove('show'); }, 3500);
        }

        function getData(){
            try {
                var raw = localStorage.getItem(STORAGE_KEY);
                if(!raw) return { focut: [], temuan: [], opm: [], joint: [], handhole: [] };
                var d = JSON.parse(raw);
                return { focut: d.focut||[], temuan: d.temuan||[], opm: d.opm||[], joint: d.joint||[], handhole: d.handhole||[] };
            } catch(e){ return { focut: [], temuan: [], opm: [], joint: [], handhole: [] }; }
        }

        function getKoordinat(item){
            var lat = parseFloat(item.lat || item.latitude || item.koordinat_lat || item.lintang || item.y || '');
            var lng = parseFloat(item.lng || item.lon || item.longitude || item.koordinat_lng || item.bujur || item.x || '');
            if ((isNaN(lat) || isNaN(lng)) && item.koordinat){
                var parts = String(item.koordinat).split(',');
                if (parts.length === 2){ lat = parseFloat(parts[0].trim()); lng = parseFloat(parts[1].trim()); }
            }
            if (isNaN(lat) || isNaN(lng)) return null;
            return [lat, lng];
        }

        function buatPopup(item, kategori){
            var k = KATEGORI[kategori];
            var html = '<div class="popup-title" style="color:' + k.warna + ';">' + k.icon + ' ' + k.label + '</div>';
            var fields = [
                ['Lokasi', item.lokasi || item.site || item.nama || item.lokasiNama],
                ['Tanggal', item.tanggal || item.tgl || item.date],
                ['Penyebab', item.penyebab],
                ['Jalur', item.jalur],
                ['Tipe', item.tipe],
                ['Status', item.status],
                ['Kondisi', item.kondisi],
                ['Keterangan', item.keterangan || item.deskripsi || item.catatan]
            ];
            fields.forEach(function(f){ if (f[1]) html += '<div class="popup-row"><b>' + f[0] + ':</b> ' + f[1] + '</div>'; });
            html += '<span class="popup-badge" style="background:' + k.warna + '22;color:' + k.warna + ';border:1px solid ' + k.warna + ';">' + k.label.toUpperCase() + '</span>';
            return html;
        }

        function renderMarkers(){
            markers.forEach(function(m){ markerSource.removeFeature(m.feature); });
            markers = [];
            markersByType = { focut: [], temuan: [], opm: [], joint: [], handhole: [] };
            var data = getData();
            var counters = { focut: 0, temuan: 0, opm: 0, joint: 0, handhole: 0 };

            Object.keys(KATEGORI).forEach(function(kat){
                var list = data[kat] || [];
                list.forEach(function(item){
                    var koord = getKoordinat(item);
                    if (!koord) return;
                    var feature = new ol.Feature({
                        geometry: new ol.geom.Point(ol.proj.fromLonLat([koord[1], koord[0]])),
                        kategori: kat
                    });
                    feature.set('popupHtml', buatPopup(item, kat));
                    feature.set('data', item);
                    if (markerVisibility[kat]) markerSource.addFeature(feature);
                    var markerObj = { feature: feature, kategori: kat, data: item };
                    markers.push(markerObj);
                    markersByType[kat].push(markerObj);
                    counters[kat]++;
                });
            });

            document.getElementById('cntFocut').textContent    = counters.focut;
            document.getElementById('cntTemuan').textContent   = counters.temuan;
            document.getElementById('cntOpm').textContent      = counters.opm;
            document.getElementById('cntJoint').textContent    = counters.joint;
            document.getElementById('cntHandhole').textContent = counters.handhole;
        }

        /* ============================================================
           KML UPLOAD / CLEAR
           ============================================================ */
        function uploadKML() { document.getElementById('kmlFileInput').click(); }

        document.getElementById('kmlFileInput').addEventListener('change', function(e){
            var file = e.target.files[0];
            if (!file) return;
            loadKMLFile(file);
            e.target.value = '';
        });

        function loadKMLFile(file) {
            var fileName = file.name;
            var isKMZ = fileName.toLowerCase().endsWith('.kmz');
            showToast('Mengupload: ' + fileName + '...', 'info');

            if (isKMZ) {
                var reader = new FileReader();
                reader.onload = function(ev) {
                    JSZip.loadAsync(ev.target.result).then(function(zip){
                        var kmlFileName = null;
                        zip.forEach(function(relativePath){
                            if (!kmlFileName && relativePath.toLowerCase().endsWith('.kml')) kmlFileName = relativePath;
                        });
                        if (!kmlFileName) { showToast('KMZ tidak berisi KML', 'error'); return; }
                        return zip.file(kmlFileName).async('string');
                    }).then(function(kmlText){
                        if (kmlText) renderKMLFromString(kmlText, fileName);
                    }).catch(function(){ showToast('Gagal baca KMZ', 'error'); });
                };
                reader.readAsArrayBuffer(file);
            } else {
                var reader = new FileReader();
                reader.onload = function(ev) { renderKMLFromString(ev.target.result, fileName); };
                reader.readAsText(file);
            }
        }

        function renderKMLFromString(kmlText, fileName) {
            try {
                kmlSource.clear();
                kmlActiveFile = null;
                var parser = new DOMParser();
                var kmlDom = parser.parseFromString(kmlText, 'text/xml');
                if (kmlDom.querySelector('parsererror')) { showToast('KML tidak valid', 'error'); return; }
                var toGeoJSONLib = getToGeoJSON();
                if (!toGeoJSONLib) { showToast('togeojson tidak tersedia', 'error'); return; }
                var geojson = toGeoJSONLib.kml(kmlDom);
                if (!geojson || !geojson.features || !geojson.features.length) { showToast('KML kosong', 'error'); return; }
                var format = new ol.format.GeoJSON();
                var features = format.readFeatures(geojson, { dataProjection: 'EPSG:4326', featureProjection: 'EPSG:3857' });
                features.forEach(function(f){
                    var name = (f.get('name') || 'Unnamed');
                    var html = '<div class="popup-title" style="color:#38bdf8;"><i class="fa-solid fa-map"></i> KML</div><div class="popup-row"><b>Nama:</b> ' + name + '</div>';
                    f.set('popupHtml', html);
                });
                kmlSource.addFeatures(features);
                kmlActiveFile = fileName;
                document.getElementById('headerInfoName').textContent = fileName;
                document.getElementById('headerInfo').classList.add('show');
                try { var extent = kmlSource.getExtent(); if (extent && isFinite(extent[0])) view.fit(extent, { padding: [60,60,60,60], duration: 500, maxZoom: 17 }); } catch(e) {}
                showToast('Berhasil upload ' + features.length + ' fitur', 'success');
            } catch(err) { showToast('Gagal parse KML: ' + err.message, 'error'); }
        }

        function clearKML() {
            if (!kmlActiveFile || kmlSource.getFeatures().length === 0) { showToast('Tidak ada KML aktif', 'info'); return; }
            if (!confirm('Hapus KML dari peta?')) return;
            kmlSource.clear();
            kmlActiveFile = null;
            document.getElementById('headerInfo').classList.remove('show');
            showToast('KML dihapus', 'success');
        }

        /* ============================================================
           TOGGLE LEGENDA
           ============================================================ */
        document.querySelectorAll('.map-legend .li[data-toggle="marker"]').forEach(function(li){
            li.addEventListener('click', function(){
                var kat = li.dataset.kat;
                markerVisibility[kat] = !markerVisibility[kat];
                markersByType[kat].forEach(function(m){
                    if (markerVisibility[kat]) { if (!markerSource.hasFeature(m.feature)) markerSource.addFeature(m.feature); }
                    else { if (markerSource.hasFeature(m.feature)) markerSource.removeFeature(m.feature); }
                });
                if (markerVisibility[kat]) li.classList.remove('off');
                else li.classList.add('off');
            });
        });

        /* ============================================================
           KLIK FITUR
           ============================================================ */
        map.on('singleclick', function(evt){
            if (is3DEnabled) return; // nonaktifkan popup di mode 3D
            var feature = map.forEachFeatureAtPixel(evt.pixel, function(f){ return f; }, { hitTolerance: 5 });
            if (feature) {
                var html = feature.get('popupHtml');
                if (html) {
                    popupContent.innerHTML = html;
                    popupContainer.style.display = 'block';
                    var geometry = feature.getGeometry();
                    var coord = geometry.getType() === 'Point' ? geometry.getCoordinates() : evt.coordinate;
                    popupOverlay.setPosition(coord);
                }
            } else {
                popupOverlay.setPosition(undefined);
                popupContainer.style.display = 'none';
            }
        });

        map.on('pointermove', function(evt){
            if (is3DEnabled) return;
            var hit = map.hasFeatureAtPixel(evt.pixel, { hitTolerance: 5 });
            map.getTargetElement().style.cursor = hit ? 'pointer' : '';
        });

        /* ============================================================
           LISTENER PESAN
           ============================================================ */
        window.addEventListener('message', function (event) {
            var data = event.data || {};
            if (data.type === 'theme-change') {
                if (data.theme === 'light') document.body.classList.add('light-mode');
                else document.body.classList.remove('light-mode');
            }
            else if (data.type === 'refresh-markers') renderMarkers();
        });

        window.addEventListener('storage', function(e){
            if (e.key === STORAGE_KEY) renderMarkers();
        });
        setInterval(renderMarkers, 5000);

        /* ============================================================
           INIT
           ============================================================ */
        renderMarkers();

        setTimeout(function () { map.updateSize(); }, 200);
        setTimeout(function () { map.updateSize(); }, 800);
        window.addEventListener('resize', function () { map.updateSize(); });
    </script>
</body>
