<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maps - BUCIN (OpenLayers)</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- OpenLayers CSS & JS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@9.2.4/ol.css" />
    <script src="https://cdn.jsdelivr.net/npm/ol@9.2.4/dist/ol.js"></script>

    <!-- togeojson UMD -->
    <script src="https://unpkg.com/@tmcw/togeojson@5.8.1/dist/togeojson.umd.js"></script>
    <!-- JSZip untuk KMZ -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

    <style>
        * { box-sizing: border-box; }
        html, body {
            margin: 0; padding: 0;
            height: 100%;
            font-family: 'Poppins', sans-serif;
            background: #0f172a;
            overflow: hidden;
        }
        #map { width: 100%; height: 100%; background: #0f172a; position: relative; }

        /* ============ HEADER ============ */
        .maps-header {
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 44px;
            z-index: 500;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 12px;
            background: rgba(15, 23, 42, 0.92);
            border-bottom: 1px solid rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            transition: background 0.3s ease;
        }
        .maps-header .header-title {
            font-size: 12px; font-weight: 800; color: #38bdf8;
            display: flex; align-items: center; gap: 6px;
            margin-right: 8px; flex-shrink: 0;
        }
        .maps-header .header-title i { color: #f43f5e; font-size: 12px; }
        .maps-header .header-title span { color: #e2e8f0; font-weight: 600; font-size: 11px; }

        .header-btn {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.25);
            color: #e2e8f0;
            padding: 5px 10px;
            border-radius: 6px;
            font-size: 11px; font-weight: 700;
            cursor: pointer; font-family: 'Poppins', sans-serif;
            display: inline-flex; align-items: center; gap: 5px;
            transition: all 0.2s ease; white-space: nowrap;
        }
        .header-btn:hover { color: #38bdf8; border-color: #38bdf8; }
        .header-btn.primary { color: #10b981; border-color: rgba(16, 185, 129, 0.6); }
        .header-btn.primary:hover { background: rgba(16, 185, 129, 0.15); border-color: #10b981; }
        .header-btn.danger { color: #f43f5e; border-color: rgba(244, 63, 94, 0.6); }
        .header-btn.danger:hover { background: rgba(244, 63, 94, 0.15); border-color: #f43f5e; }
        .header-btn.warning { color: #f59e0b; border-color: rgba(245, 158, 11, 0.6); }
        .header-btn.warning:hover { background: rgba(245, 158, 11, 0.15); border-color: #f59e0b; }
        .header-btn i { font-size: 11px; }

        .header-info {
            display: none; align-items: center; gap: 6px;
            padding: 4px 10px;
            background: rgba(16, 185, 129, 0.12);
            border: 1px solid rgba(16, 185, 129, 0.4);
            border-radius: 6px;
            font-size: 10px; font-weight: 700; color: #10b981;
            margin-left: auto;
        }
        .header-info.show { display: inline-flex; }
        .header-info .info-name {
            color: #fff; font-weight: 600;
            max-width: 180px; white-space: nowrap;
            overflow: hidden; text-overflow: ellipsis;
        }
        .header-info button {
            background: transparent; border: none; color: #94a3b8;
            cursor: pointer; font-size: 11px; padding: 0;
        }
        .header-info button:hover { color: #f43f5e; }

        /* ============ LEGENDA ============ */
        .map-legend {
            position: absolute;
            top: 54px; left: 10px;
            background: rgba(15, 23, 42, 0.88);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 7px;
            padding: 6px 8px;
            z-index: 450;
            font-size: 9.5px; color: #e2e8f0;
            max-width: 175px;
            max-height: calc(100vh - 70px);
            overflow-y: auto;
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
        }
        .map-legend::-webkit-scrollbar { width: 3px; }
        .map-legend::-webkit-scrollbar-thumb { background: rgba(56, 189, 248, 0.4); border-radius: 2px; }
        .map-legend h5 {
            font-size: 9px; color: #38bdf8;
            margin: 0 0 5px 0; text-transform: uppercase;
            letter-spacing: 0.5px; font-weight: 800;
            display: flex; align-items: center; gap: 4px;
        }
        .map-legend .section-title {
            font-size: 8px; color: #94a3b8;
            text-transform: uppercase; letter-spacing: 0.5px;
            font-weight: 800; margin: 5px 0 3px 0;
            padding-top: 4px; border-top: 1px dashed rgba(255,255,255,0.15);
        }
        .map-legend .section-title:first-of-type { margin-top: 0; padding-top: 0; border-top: none; }
        .map-legend .li {
            display: flex; align-items: center; gap: 5px;
            color: #e2e8f0; padding: 2px 0;
            cursor: pointer; user-select: none;
            transition: opacity 0.2s; line-height: 1.2;
        }
        .map-legend .li:hover { opacity: 0.8; }
        .map-legend .li.off { opacity: 0.3; text-decoration: line-through; }
        .map-legend .li i { font-size: 8px; width: 10px; text-align: center; flex-shrink: 0; }
        .map-legend .li .line-swatch {
            width: 12px; height: 3px; border-radius: 2px;
            flex-shrink: 0; border: 1px solid rgba(255,255,255,0.5);
        }
        .map-legend .li span.count {
            margin-left: auto; font-weight: 700;
            color: #38bdf8; font-size: 9px;
        }
        .map-legend .li span.label-text {
            white-space: nowrap; overflow: hidden;
            text-overflow: ellipsis; flex: 1;
        }

        /* ============ POPUP (OL Overlay) ============ */
        .ol-popup {
            position: absolute;
            background: rgba(15, 23, 42, 0.98);
            color: #fff;
            border: 1px solid #38bdf8;
            border-radius: 10px;
            padding: 10px 12px;
            font-size: 11px;
            min-width: 180px;
            max-width: 300px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.6);
            bottom: 12px;
            left: -50%;
            transform: translateX(-50%);
            z-index: 700;
        }
        .ol-popup::after {
            content: '';
            position: absolute;
            bottom: -8px;
            left: 50%;
            transform: translateX(-50%);
            border-width: 8px 8px 0 8px;
            border-style: solid;
            border-color: rgba(15, 23, 42, 0.98) transparent transparent transparent;
        }
        .ol-popup-closer {
            position: absolute;
            top: 4px; right: 6px;
            font-size: 14px; color: #94a3b8;
            cursor: pointer; text-decoration: none;
            font-weight: bold; line-height: 1;
        }
        .ol-popup-closer:hover { color: #f43f5e; }

        .popup-title {
            font-size: 12px; font-weight: 800;
            margin-bottom: 5px; display: flex; align-items: center; gap: 5px;
        }
        .popup-row { font-size: 11px; color: #cbd5e1; line-height: 1.5; }
        .popup-row b { color: #fff; }
        .popup-badge {
            display: inline-block; padding: 1px 7px;
            border-radius: 8px; font-size: 9px;
            font-weight: 700; margin-top: 5px;
        }

        /* ============ TOAST ============ */
        .kml-toast {
            position: absolute; bottom: 20px; left: 50%;
            transform: translateX(-50%) translateY(20px);
            z-index: 600;
            background: rgba(15, 23, 42, 0.95);
            border: 1px solid rgba(56, 189, 248, 0.5);
            color: #fff; padding: 8px 16px; border-radius: 8px;
            font-size: 12px; font-weight: 600;
            display: flex; align-items: center; gap: 8px;
            opacity: 0; pointer-events: none; transition: all 0.3s ease;
        }
        .kml-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
        .kml-toast.success { border-color: rgba(16, 185, 129, 0.6); }
        .kml-toast.error { border-color: rgba(244, 63, 94, 0.6); }

        /* ============ OL CONTROL POSITION ============ */
        .ol-zoom {
            top: 54px !important;
            right: 10px !important;
            left: auto !important;
        }
        .ol-zoom .ol-zoom-in,
        .ol-zoom .ol-zoom-out {
            background: rgba(15, 23, 42, 0.92) !important;
            color: #e2e8f0 !important;
            border: 1px solid rgba(255, 255, 255, 0.25) !important;
            width: 30px !important; height: 30px !important;
            font-size: 16px !important;
            line-height: 30px !important;
            border-radius: 6px !important;
            margin: 0 0 4px 0 !important;
            padding: 0 !important;
            font-weight: 700 !important;
            cursor: pointer !important;
        }
        .ol-zoom .ol-zoom-in:hover,
        .ol-zoom .ol-zoom-out:hover {
            background: rgba(30, 41, 59, 1) !important;
            color: #38bdf8 !important;
            border-color: #38bdf8 !important;
        }
        .ol-attribution {
            font-size: 10px !important;
            background: rgba(15, 23, 42, 0.8) !important;
            border-radius: 4px !important;
        }
        .ol-attribution a { color: #38bdf8 !important; }
        .ol-attribution button {
            background: rgba(15, 23, 42, 0.9) !important;
            color: #e2e8f0 !important;
            border: none !important;
        }

        /* ============ LIGHT MODE ============ */
        body.light-mode .maps-header {
            background: rgba(255, 255, 255, 0.95);
            border-bottom-color: rgba(15, 23, 42, 0.3);
        }
        body.light-mode .maps-header .header-title { color: #0284c7; }
        body.light-mode .maps-header .header-title i { color: #e11d48; }
        body.light-mode .maps-header .header-title span { color: #0f172a; }
        body.light-mode .header-btn { color: #0f172a; border-color: rgba(15, 23, 42, 0.3); }
        body.light-mode .header-btn.primary { color: #059669; border-color: rgba(5, 150, 105, 0.6); }
        body.light-mode .header-btn.danger { color: #e11d48; border-color: rgba(225, 29, 72, 0.6); }
        body.light-mode .header-btn.warning { color: #d97706; border-color: rgba(217, 119, 6, 0.6); }
        body.light-mode .map-legend {
            background: rgba(255, 255, 255, 0.96);
            border-color: rgba(15, 23, 42, 0.4);
        }
        body.light-mode .map-legend h5 { color: #0284c7; }
        body.light-mode .map-legend .li { color: #0f172a; }
        body.light-mode .map-legend .section-title { color: #64748b; border-top-color: rgba(15,23,42,0.15); }
        body.light-mode .ol-zoom .ol-zoom-in,
        body.light-mode .ol-zoom .ol-zoom-out {
            background: rgba(255, 255, 255, 0.92) !important;
            color: #0f172a !important;
            border-color: rgba(15, 23, 42, 0.25) !important;
        }
        body.light-mode .ol-zoom .ol-zoom-in:hover,
        body.light-mode .ol-zoom .ol-zoom-out:hover {
            background: rgba(241, 245, 249, 1) !important;
            color: #0284c7 !important;
            border-color: #0284c7 !important;
        }
        body.light-mode .ol-attribution {
            background: rgba(255, 255, 255, 0.85) !important;
            color: #0f172a !important;
        }
        body.light-mode .ol-popup {
            background: rgba(255, 255, 255, 0.98);
            color: #0f172a;
            border-color: #0284c7;
        }
        body.light-mode .ol-popup::after {
            border-color: rgba(255, 255, 255, 0.98) transparent transparent transparent;
        }
        body.light-mode .popup-row { color: #334155; }
        body.light-mode .popup-row b { color: #0f172a; }

        @media (max-width: 640px) {
            .maps-header { padding: 4px 8px; gap: 5px; height: 40px; }
            .maps-header .header-title span { display: none; }
            .header-btn { padding: 4px 7px; font-size: 10px; }
            .header-btn span { display: none; }
            .header-info { display: none !important; }
            .map-legend { top: 48px; left: 6px; font-size: 8.5px; max-width: 140px; padding: 5px 6px; }
            .ol-zoom { top: 48px !important; right: 6px !important; }
        }
    </style>
</head>
<body>

    <div id="map"></div>

    <!-- ===== HEADER ===== -->
    <div class="maps-header">
        <div class="header-title">
            <i class="fa-solid fa-map"></i>
            <span>Peta Insiden Jaringan</span>
        </div>
        <button class="header-btn primary" onclick="uploadKML()" title="Upload file KML/KMZ">
            <i class="fa-solid fa-cloud-arrow-up"></i> <span>Upload</span>
        </button>
        <button class="header-btn" onclick="downloadKML()" title="Download KML">
            <i class="fa-solid fa-download"></i> <span>Download</span>
        </button>
        <button class="header-btn warning" onclick="toggleAllLines()" title="Show/Hide semua line">
            <i class="fa-solid fa-layer-group"></i> <span>Lines</span>
        </button>
        <button class="header-btn danger" onclick="clearKML()" title="Hapus file KML dari peta">
            <i class="fa-solid fa-trash"></i> <span>Clear</span>
        </button>
        <div class="header-info" id="headerInfo">
            <i class="fa-solid fa-file-import"></i>
            <span class="info-name" id="headerInfoName">-</span>
            <button onclick="clearKML()" title="Tutup"><i class="fa-solid fa-xmark"></i></button>
        </div>
    </div>

    <input type="file" id="kmlFileInput" accept=".kml,.kmz" style="display:none;">

    <!-- ===== LEGENDA ===== -->
    <div class="map-legend">
        <h5><i class="fa-solid fa-list"></i> Legenda</h5>

        <div class="section-title">Data Input</div>
        <div class="li" data-toggle="marker" data-kat="focut">
            <i class="fa-solid fa-scissors" style="color:#f43f5e;"></i>
            <span class="label-text">FO Cut</span>
            <span class="count" id="cntFocut">0</span>
        </div>
        <div class="li" data-toggle="marker" data-kat="temuan">
            <i class="fa-solid fa-magnifying-glass" style="color:#10b981;"></i>
            <span class="label-text">Temuan</span>
            <span class="count" id="cntTemuan">0</span>
        </div>
        <div class="li" data-toggle="marker" data-kat="opm">
            <i class="fa-solid fa-wave-square" style="color:#38bdf8;"></i>
            <span class="label-text">OPM/OLS</span>
            <span class="count" id="cntOpm">0</span>
        </div>
        <div class="li" data-toggle="marker" data-kat="joint">
            <i class="fa-solid fa-circle-nodes" style="color:#f59e0b;"></i>
            <span class="label-text">Joint</span>
            <span class="count" id="cntJoint">0</span>
        </div>
        <div class="li" data-toggle="marker" data-kat="handhole">
            <i class="fa-solid fa-box-open" style="color:#a855f7;"></i>
            <span class="label-text">Handhole</span>
            <span class="count" id="cntHandhole">0</span>
        </div>

        <div class="section-title">Backbone Lines</div>
        <div class="li" data-toggle="line" data-line="dwdm" id="leg-dwdm">
            <span class="line-swatch" style="background:#00ffff;"></span>
            <span class="label-text">DWDM PNK-TTC</span>
        </div>
        <div class="li" data-toggle="line" data-line="seaus1" id="leg-seaus1">
            <span class="line-swatch" style="background:#ff0000;"></span>
            <span class="label-text">SEA US LINE 1</span>
        </div>
        <div class="li" data-toggle="line" data-line="seaus2" id="leg-seaus2">
            <span class="line-swatch" style="background:#ffff00;"></span>
            <span class="label-text">SEA US LINE 2</span>
        </div>
        <div class="li" data-toggle="line" data-line="igg1" id="leg-igg1">
            <span class="line-swatch" style="background:#00ff00;"></span>
            <span class="label-text">IGG LINE 1</span>
        </div>
        <div class="li" data-toggle="line" data-line="igg2" id="leg-igg2">
            <span class="line-swatch" style="background:#ff00ff;"></span>
            <span class="label-text">IGG LINE 2</span>
        </div>
        <div class="li" data-toggle="line" data-line="mbh" id="leg-mbh">
            <span class="line-swatch" style="background:#ff8800;"></span>
            <span class="label-text">MBH SEA-US</span>
        </div>
        <div class="li" data-toggle="line" data-line="osp1" id="leg-osp1">
            <span class="line-swatch" style="background:#0066ff;"></span>
            <span class="label-text">OSP LINE 1</span>
        </div>
        <div class="li" data-toggle="line" data-line="osp2" id="leg-osp2">
            <span class="line-swatch" style="background:#ff69b4;"></span>
            <span class="label-text">OSP LINE 2</span>
        </div>
        <div class="li" data-toggle="line" data-line="osp3" id="leg-osp3">
            <span class="line-swatch" style="background:#9d00ff;"></span>
            <span class="label-text">OSP LINE 3</span>
        </div>
    </div>

    <div class="kml-toast" id="kmlToast"></div>

    <!-- Popup overlay -->
    <div id="popup" class="ol-popup" style="display:none;">
        <a href="#" id="popup-closer" class="ol-popup-closer">&times;</a>
        <div id="popup-content"></div>
    </div>

    <!-- ============ LOAD DATA LINE DARI FILE TERPISAH ============ -->
    <script src="lines-data.js"></script>

    <script>
        /* ============================================================
           MAP BUCIN - OpenLayers Version
           ============================================================ */

        function getToGeoJSON() {
            return window.toGeoJSON || window.togeojson || null;
        }

        var MANADO_CENTER = [124.8421, 1.4748]; // [lon, lat]
        var MANADO_ZOOM   = 11;

        /* ============================================================
           INISIALISASI PETA OPENLAYERS
           ============================================================ */
        var view = new ol.View({
            center: ol.proj.fromLonLat(MANADO_CENTER),
            zoom: MANADO_ZOOM,
            maxZoom: 19,
            minZoom: 3
        });

        /* ============================================================
           BASEMAP — OpenStreetMap Standar
           Gratis, tanpa API key. Untuk produksi trafik tinggi,
           pertimbangkan self-hosted tiles atau penyedia berbayar.
           ============================================================ */
        var baseLayer = new ol.layer.Tile({
            source: new ol.source.OSM({
                url: 'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
                attributions: '© <a href="https://www.openstreetmap.org/copyright" target="_blank">OpenStreetMap</a> contributors',
                crossOrigin: 'anonymous'
            })
        });

        // Layer untuk marker insiden
        var markerSource = new ol.source.Vector();
        var markerLayer = new ol.layer.Vector({
            source: markerSource,
            style: function(feature) {
                var kat = feature.get('kategori');
                var warna = KATEGORI[kat] ? KATEGORI[kat].warna : '#38bdf8';
                return new ol.style.Style({
                    image: new ol.style.Circle({
                        radius: 8,
                        fill: new ol.style.Fill({ color: warna }),
                        stroke: new ol.style.Stroke({ color: '#fff', width: 2 })
                    })
                });
            }
        });

        // Layer untuk polyline backbone
        var lineSource = new ol.source.Vector();
        var lineLayer = new ol.layer.Vector({
            source: lineSource,
            style: function(feature) {
                var color = feature.get('lineColor') || '#38bdf8';
                return new ol.style.Style({
                    stroke: new ol.style.Stroke({
                        color: color,
                        width: 3,
                        lineCap: 'round',
                        lineJoin: 'round'
                    })
                });
            }
        });

        // Layer untuk KML yang di-upload
        var kmlSource = new ol.source.Vector();
        var kmlLayer = new ol.layer.Vector({
            source: kmlSource,
            style: function(feature) {
                var geomType = feature.getGeometry().getType();
                if (geomType === 'LineString' || geomType === 'MultiLineString') {
                    return new ol.style.Style({
                        stroke: new ol.style.Stroke({
                            color: '#38bdf8',
                            width: 3,
                            lineCap: 'round',
                            lineJoin: 'round'
                        })
                    });
                }
                if (geomType === 'Polygon' || geomType === 'MultiPolygon') {
                    return new ol.style.Style({
                        stroke: new ol.style.Stroke({ color: '#10b981', width: 2 }),
                        fill: new ol.style.Fill({ color: 'rgba(16, 185, 129, 0.15)' })
                    });
                }
                return new ol.style.Style({
                    image: new ol.style.Circle({
                        radius: 6,
                        fill: new ol.style.Fill({ color: '#38bdf8' }),
                        stroke: new ol.style.Stroke({ color: '#fff', width: 2 })
                    })
                });
            }
        });

        // Buat peta
        var map = new ol.Map({
            target: 'map',
            layers: [baseLayer, lineLayer, markerLayer, kmlLayer],
            view: view,
            controls: ol.control.defaults.defaults({
                attribution: true,
                zoom: true,
                rotate: false
            })
        });

        // Pindahkan zoom control ke kanan atas
        var zoomControl = map.getControls().getArray().find(function(c) {
            return c instanceof ol.control.Zoom;
        });
        if (zoomControl) zoomControl.setPosition('top-right');

        var attrControl = map.getControls().getArray().find(function(c) {
            return c instanceof ol.control.Attribution;
        });
        if (attrControl) attrControl.setPosition('bottom-right');

        var STORAGE_KEY = 'bucin_data';

        var KATEGORI = {
            focut:    { warna: '#f43f5e', label: 'FO Cut',    icon: '✂️' },
            temuan:   { warna: '#10b981', label: 'Temuan',    icon: '🔍' },
            opm:      { warna: '#38bdf8', label: 'OPM / OLS', icon: '📊' },
            joint:    { warna: '#f59e0b', label: 'Joint',     icon: '🔗' },
            handhole: { warna: '#a855f7', label: 'Handhole',  icon: '📦' }
        };

        var markers = [];
        var markersByType = { focut: [], temuan: [], opm: [], joint: [], handhole: [] };
        var markerVisibility = { focut: true, temuan: true, opm: true, joint: true, handhole: true };

        var kmlActiveFile = null;

        /* ============================================================
           POPUP OVERLAY
           ============================================================ */
        var popupContainer = document.getElementById('popup');
        var popupContent   = document.getElementById('popup-content');
        var popupCloser    = document.getElementById('popup-closer');

        var popupOverlay = new ol.Overlay({
            element: popupContainer,
            autoPan: { animation: { duration: 250 } },
            positioning: 'bottom-center',
            offset: [0, -12]
        });
        map.addOverlay(popupOverlay);

        popupCloser.onclick = function() {
            popupOverlay.setPosition(undefined);
            popupContainer.style.display = 'none';
            popupCloser.blur();
            return false;
        };

        /* ============================================================
           KONFIGURASI LINE
           ============================================================ */
        var lines = {};
        var lineVisibility = {};

        var LINE_CONFIG = [
            { key: 'dwdm',   name: 'DWDM PNK-TTC',  color: '#00ffff', coords: typeof LINE_DWDM   !== 'undefined' ? LINE_DWDM   : [] },
            { key: 'seaus1', name: 'SEA US LINE 1', color: '#ff0000', coords: typeof LINE_SEAUS1 !== 'undefined' ? LINE_SEAUS1 : [] },
            { key: 'seaus2', name: 'SEA US LINE 2', color: '#ffff00', coords: typeof LINE_SEAUS2 !== 'undefined' ? LINE_SEAUS2 : [] },
            { key: 'igg1',   name: 'IGG LINE 1',    color: '#00ff00', coords: typeof LINE_IGG1   !== 'undefined' ? LINE_IGG1   : [] },
            { key: 'igg2',   name: 'IGG LINE 2',    color: '#ff00ff', coords: typeof LINE_IGG2   !== 'undefined' ? LINE_IGG2   : [] },
            { key: 'mbh',    name: 'MBH SEA-US',    color: '#ff8800', coords: typeof LINE_MBH    !== 'undefined' ? LINE_MBH    : [] },
            { key: 'osp1',   name: 'OSP LINE 1',    color: '#0066ff', coords: typeof LINE_OSP1   !== 'undefined' ? LINE_OSP1   : [] },
            { key: 'osp2',   name: 'OSP LINE 2',    color: '#ff69b4', coords: typeof LINE_OSP2   !== 'undefined' ? LINE_OSP2   : [] },
            { key: 'osp3',   name: 'OSP LINE 3',    color: '#9d00ff', coords: typeof LINE_OSP3   !== 'undefined' ? LINE_OSP3   : [] }
        ];

        function initAllLines() {
            var loadedCount = 0;
            LINE_CONFIG.forEach(function(cfg){
                if (!cfg.coords || cfg.coords.length < 2) {
                    console.warn('Line ' + cfg.key + ' kosong / tidak ditemukan');
                    return;
                }
                var olCoords = cfg.coords.map(function(c){
                    return ol.proj.fromLonLat([c[1], c[0]]);
                });
                var feature = new ol.Feature({
                    geometry: new ol.geom.LineString(olCoords),
                    lineKey: cfg.key,
                    lineName: cfg.name,
                    lineColor: cfg.color,
                    isLine: true
                });
                feature.set('popupHtml',
                    '<div class="popup-title" style="color:' + cfg.color + ';">' +
                        '<i class="fa-solid fa-network-wired"></i> ' + cfg.name +
                    '</div>' +
                    '<div class="popup-row"><b>Total titik:</b> ' + cfg.coords.length + '</div>' +
                    '<span class="popup-badge" style="background:' + cfg.color + '22;color:' + cfg.color + ';border:1px solid ' + cfg.color + ';">BACKBONE LINE</span>'
                );
                lineSource.addFeature(feature);
                lines[cfg.key] = feature;
                lineVisibility[cfg.key] = true;
                loadedCount++;
            });
            console.log('Lines loaded: ' + loadedCount + ' / ' + LINE_CONFIG.length);
        }

        function toggleLine(key) {
            var feature = lines[key];
            if (!feature) return;
            var li = document.getElementById('leg-' + key);
            if (lineVisibility[key]) {
                lineSource.removeFeature(feature);
                lineVisibility[key] = false;
                if (li) li.classList.add('off');
            } else {
                lineSource.addFeature(feature);
                lineVisibility[key] = true;
                if (li) li.classList.remove('off');
            }
        }

        var allLinesVisible = true;
        function toggleAllLines() {
            allLinesVisible = !allLinesVisible;
            Object.keys(lines).forEach(function(key){
                var feature = lines[key];
                var li = document.getElementById('leg-' + key);
                if (allLinesVisible) {
                    lineSource.addFeature(feature);
                    lineVisibility[key] = true;
                    if (li) li.classList.remove('off');
                } else {
                    lineSource.removeFeature(feature);
                    lineVisibility[key] = false;
                    if (li) li.classList.add('off');
                }
            });
            showToast(allLinesVisible ? 'Semua line ditampilkan' : 'Semua line disembunyikan', 'info');
        }

        function showToast(msg, type) {
            var toast = document.getElementById('kmlToast');
            var icon = type === 'error' ? 'fa-circle-exclamation' :
                       type === 'success' ? 'fa-circle-check' : 'fa-circle-info';
            var color = type === 'error' ? '#f43f5e' :
                        type === 'success' ? '#10b981' : '#38bdf8';
            toast.innerHTML = '<i class="fa-solid ' + icon + '" style="color:' + color + ';"></i> ' + msg;
            toast.className = 'kml-toast show ' + (type || '');
            setTimeout(function() { toast.classList.remove('show'); }, 3500);
        }

        function getData(){
            try {
                var raw = localStorage.getItem(STORAGE_KEY);
                if(!raw) return { focut: [], temuan: [], opm: [], joint: [], handhole: [] };
                var d = JSON.parse(raw);
                return {
                    focut:    d.focut    || [],
                    temuan:   d.temuan   || [],
                    opm:      d.opm      || [],
                    joint:    d.joint    || [],
                    handhole: d.handhole || []
                };
            } catch(e){
                return { focut: [], temuan: [], opm: [], joint: [], handhole: [] };
            }
        }

        function getKoordinat(item){
            var lat = parseFloat(item.lat || item.latitude || item.koordinat_lat || item.lintang || item.y || '');
            var lng = parseFloat(item.lng || item.lon || item.longitude || item.koordinat_lng || item.bujur || item.x || '');
            if ((isNaN(lat) || isNaN(lng)) && item.koordinat){
                var parts = String(item.koordinat).split(',');
                if (parts.length === 2){
                    lat = parseFloat(parts[0].trim());
                    lng = parseFloat(parts[1].trim());
                }
            }
            if (isNaN(lat) || isNaN(lng)) return null;
            return [lat, lng];
        }

        function buatPopup(item, kategori){
            var k = KATEGORI[kategori];
            var html = '<div class="popup-title" style="color:' + k.warna + ';">' + k.icon + ' ' + k.label + '</div>';
            var fields = [
                ['Lokasi',     item.lokasi || item.site || item.nama || item.lokasiNama],
                ['Tanggal',    item.tanggal || item.tgl || item.date],
                ['Penyebab',   item.penyebab],
                ['Jalur',      item.jalur],
                ['Tipe',       item.tipe],
                ['Status',     item.status],
                ['Kondisi',    item.kondisi],
                ['Keterangan', item.keterangan || item.deskripsi || item.catatan]
            ];
            fields.forEach(function(f){
                if (f[1]) html += '<div class="popup-row"><b>' + f[0] + ':</b> ' + f[1] + '</div>';
            });
            html += '<span class="popup-badge" style="background:' + k.warna + '22;color:' + k.warna + ';border:1px solid ' + k.warna + ';">' + k.label.toUpperCase() + '</span>';
            return html;
        }

        function renderMarkers(){
            markers.forEach(function(m){
                markerSource.removeFeature(m.feature);
            });
            markers = [];
            markersByType = { focut: [], temuan: [], opm: [], joint: [], handhole: [] };

            var data = getData();
            var counters = { focut: 0, temuan: 0, opm: 0, joint: 0, handhole: 0 };

            Object.keys(KATEGORI).forEach(function(kat){
                var list = data[kat] || [];
                list.forEach(function(item){
                    var koord = getKoordinat(item);
                    if (!koord) return;

                    var feature = new ol.Feature({
                        geometry: new ol.geom.Point(ol.proj.fromLonLat([koord[1], koord[0]])),
                        kategori: kat
                    });
                    feature.set('popupHtml', buatPopup(item, kat));
                    feature.set('data', item);

                    if (markerVisibility[kat]) {
                        markerSource.addFeature(feature);
                    }

                    var markerObj = { feature: feature, kategori: kat, data: item };
                    markers.push(markerObj);
                    markersByType[kat].push(markerObj);
                    counters[kat]++;
                });
            });

            document.getElementById('cntFocut').textContent    = counters.focut;
            document.getElementById('cntTemuan').textContent   = counters.temuan;
            document.getElementById('cntOpm').textContent      = counters.opm;
            document.getElementById('cntJoint').textContent    = counters.joint;
            document.getElementById('cntHandhole').textContent = counters.handhole;
        }

        function terapkanFilter(filter){
            markers.forEach(function(m){
                var show = false;
                if (filter === 'all') show = true;
                else if (filter === 'p1'){
                    var p = String(m.data.penyebab || '').toLowerCase();
                    show = p.includes('pihak') || p.includes('ke3') || p.includes('ke-3');
                }
                else if (filter === 'fibercut') show = m.kategori === 'focut';
                else if (filter === 'restored'){
                    var s = String(m.data.status || '').toLowerCase();
                    show = s.includes('resolved') || s.includes('selesai') || s.includes('ok');
                }
                else if (['focut','temuan','opm','joint','handhole'].indexOf(filter) !== -1){
                    show = m.kategori === filter;
                }
                if (show) {
                    if (!markerSource.hasFeature(m.feature)) markerSource.addFeature(m.feature);
                } else {
                    if (markerSource.hasFeature(m.feature)) markerSource.removeFeature(m.feature);
                }
            });
        }

        function resetView(){
            view.setCenter(ol.proj.fromLonLat(MANADO_CENTER));
            view.setZoom(MANADO_ZOOM);

            markers.forEach(function(m){
                if (!markerSource.hasFeature(m.feature)) markerSource.addFeature(m.feature);
            });
            Object.keys(markerVisibility).forEach(function(k){ markerVisibility[k] = true; });
            document.querySelectorAll('.map-legend .li[data-toggle="marker"]').forEach(function(li){
                li.classList.remove('off');
            });

            Object.keys(lines).forEach(function(key){
                if (!lineSource.hasFeature(lines[key])) lineSource.addFeature(lines[key]);
                lineVisibility[key] = true;
                var li = document.getElementById('leg-' + key);
                if (li) li.classList.remove('off');
            });
            allLinesVisible = true;
        }

        /* ===== UPLOAD / DOWNLOAD / CLEAR ===== */
        function uploadKML() {
            document.getElementById('kmlFileInput').click();
        }
        document.getElementById('kmlFileInput').addEventListener('change', function(e){
            var file = e.target.files[0];
            if (!file) return;
            loadKMLFile(file);
            e.target.value = '';
        });

        function loadKMLFile(file) {
            var fileName = file.name;
            var isKMZ = fileName.toLowerCase().endsWith('.kmz');
            showToast('Mengupload file: ' + fileName + '...', 'info');

            if (isKMZ) {
                var reader = new FileReader();
                reader.onload = function(ev) {
                    JSZip.loadAsync(ev.target.result).then(function(zip){
                        var kmlFileName = null;
                        zip.forEach(function(relativePath){
                            if (!kmlFileName && relativePath.toLowerCase().endsWith('.kml')) kmlFileName = relativePath;
                        });
                        if (!kmlFileName) { showToast('File KMZ tidak berisi file KML', 'error'); return; }
                        return zip.file(kmlFileName).async('string');
                    }).then(function(kmlText){
                        if (kmlText) renderKMLFromString(kmlText, fileName);
                    }).catch(function(){
                        showToast('Gagal membaca file KMZ', 'error');
                    });
                };
                reader.onerror = function() { showToast('Gagal membaca file', 'error'); };
                reader.readAsArrayBuffer(file);
            } else {
                var reader = new FileReader();
                reader.onload = function(ev) { renderKMLFromString(ev.target.result, fileName); };
                reader.onerror = function() { showToast('Gagal membaca file', 'error'); };
                reader.readAsText(file);
            }
        }

        function renderKMLFromString(kmlText, fileName) {
            try {
                kmlSource.clear();
                kmlActiveFile = null;

                var parser = new DOMParser();
                var kmlDom = parser.parseFromString(kmlText, 'text/xml');
                if (kmlDom.querySelector('parsererror')) { showToast('Format KML tidak valid', 'error'); return; }

                var toGeoJSONLib = getToGeoJSON();
                if (!toGeoJSONLib) { showToast('Library togeojson tidak tersedia', 'error'); return; }

                var geojson = toGeoJSONLib.kml(kmlDom);
                if (!geojson || !geojson.features || !geojson.features.length) {
                    showToast('File KML tidak berisi data', 'error'); return;
                }

                var format = new ol.format.GeoJSON();
                var features = format.readFeatures(geojson, {
                    dataProjection: 'EPSG:4326',
                    featureProjection: 'EPSG:3857'
                });

                features.forEach(function(f){
                    var name = (f.get('name') || (f.getProperties() && f.getProperties().name) || 'Unnamed');
                    var desc = (f.get('description') || '');
                    var html = '<div class="popup-title" style="color:#38bdf8;"><i class="fa-solid fa-map"></i> KML</div>' +
                               '<div class="popup-row"><b>Nama:</b> ' + name + '</div>';
                    if (desc) html += '<div class="popup-row"><b>Deskripsi:</b> ' + desc + '</div>';
                    f.set('popupHtml', html);
                });

                kmlSource.addFeatures(features);
                kmlActiveFile = fileName;
                document.getElementById('headerInfoName').textContent = fileName;
                document.getElementById('headerInfo').classList.add('show');

                try {
                    var extent = kmlSource.getExtent();
                    if (extent && isFinite(extent[0])) {
                        view.fit(extent, { padding: [60, 60, 60, 60], duration: 500, maxZoom: 17 });
                    }
                } catch(e) {}

                showToast('Berhasil upload ' + features.length + ' fitur', 'success');
            } catch(err) {
                showToast('Gagal parse KML: ' + err.message, 'error');
            }
        }

        function clearKML() {
            if (!kmlActiveFile || kmlSource.getFeatures().length === 0) {
                showToast('Tidak ada file KML yang aktif', 'info');
                return;
            }
            if (!confirm('Hapus file KML dari peta?')) return;
            kmlSource.clear();
            kmlActiveFile = null;
            document.getElementById('headerInfo').classList.remove('show');
            showToast('File KML berhasil dihapus', 'success');
        }

        function downloadKML() {
            var data = getData();
            var totalPoints = 0;
            Object.keys(KATEGORI).forEach(function(kat){
                (data[kat] || []).forEach(function(item){ if (getKoordinat(item)) totalPoints++; });
            });
            var totalLines = 0;
            LINE_CONFIG.forEach(function(cfg){ if (cfg.coords && cfg.coords.length > 1) totalLines++; });
            if (totalPoints === 0 && totalLines === 0) {
                showToast('Tidak ada data untuk di-download', 'error'); return;
            }

            var kmlLines = [];
            kmlLines.push('<?xml version="1.0" encoding="UTF-8"?>');
            kmlLines.push('<kml xmlns="http://www.opengis.net/kml/2.2">');
            kmlLines.push('  <Document>');
            kmlLines.push('    <name>BUCIN Data Export</name>');
            kmlLines.push('    <description>Export - ' + new Date().toLocaleString('id-ID') + '</description>');

            Object.keys(KATEGORI).forEach(function(kat){
                var k = KATEGORI[kat];
                kmlLines.push('    <Style id="style-' + kat + '"><IconStyle><color>' + hexToKMLColor(k.warna) + '</color><scale>1.2</scale><Icon><href>http://maps.google.com/mapfiles/kml/shapes/placemark_circle.png</href></Icon></IconStyle></Style>');
            });
            LINE_CONFIG.forEach(function(cfg){
                kmlLines.push('    <Style id="style-line-' + cfg.key + '"><LineStyle><color>' + hexToKMLColor(cfg.color) + '</color><width>3</width></LineStyle></Style>');
            });

            Object.keys(KATEGORI).forEach(function(kat){
                var k = KATEGORI[kat];
                var valid = (data[kat] || []).filter(function(item){ return getKoordinat(item); });
                if (!valid.length) return;
                kmlLines.push('    <Folder><name>' + escapeXml(k.label) + '</name>');
                valid.forEach(function(item){
                    var koord = getKoordinat(item);
                    var nama = item.lokasi || item.nama || item.site || item.id || ('Titik ' + kat);
                    var desc = buildKMLDescription(item, kat);
                    kmlLines.push('      <Placemark><name>' + escapeXml(nama) + '</name><description><![CDATA[' + desc + ']]></description><styleUrl>#style-' + kat + '</styleUrl><Point><coordinates>' + koord[1] + ',' + koord[0] + ',0</coordinates></Point></Placemark>');
                });
                kmlLines.push('    </Folder>');
            });

            kmlLines.push('    <Folder><name>Backbone Lines</name>');
            LINE_CONFIG.forEach(function(cfg){
                if (!cfg.coords || cfg.coords.length < 2) return;
                kmlLines.push('      <Placemark><name>' + escapeXml(cfg.name) + '</name><styleUrl>#style-line-' + cfg.key + '</styleUrl><LineString><tessellate>1</tessellate><coordinates>' + cfg.coords.map(function(c){ return c[1] + ',' + c[0] + ',0'; }).join(' ') + '</coordinates></LineString></Placemark>');
            });
            kmlLines.push('    </Folder>');

            if (kmlSource.getFeatures().length > 0) {
                var format = new ol.format.GeoJSON();
                var geojson = JSON.parse(format.writeFeatures(kmlSource.getFeatures(), {
                    dataProjection: 'EPSG:4326',
                    featureProjection: 'EPSG:3857'
                }));
                var kmlFromGeojson = geojsonToKML(geojson, 'Imported Layer');
                if (kmlFromGeojson) kmlLines.push(kmlFromGeojson);
            }

            kmlLines.push('  </Document>');
            kmlLines.push('</kml>');

            downloadBlob(kmlLines.join('\n'), 'bucin_export_' + getTimestamp() + '.kml', 'application/vnd.google-earth.kml+xml');
            showToast('Download KML berhasil (' + totalPoints + ' titik + ' + totalLines + ' line)', 'success');
        }

        function buildKMLDescription(item, kategori) {
            var lines = [];
            if (item.lokasi) lines.push('<b>Lokasi:</b> ' + escapeHtml(item.lokasi));
            if (item.tanggal || item.tgl) lines.push('<b>Tanggal:</b> ' + (item.tanggal || item.tgl));
            if (item.penyebab) lines.push('<b>Penyebab:</b> ' + escapeHtml(item.penyebab));
            if (item.jalur) lines.push('<b>Jalur:</b> ' + escapeHtml(item.jalur));
            if (item.tipe) lines.push('<b>Tipe:</b> ' + escapeHtml(item.tipe));
            if (item.status) lines.push('<b>Status:</b> ' + escapeHtml(item.status));
            if (item.kondisi) lines.push('<b>Kondisi:</b> ' + escapeHtml(item.kondisi));
            if (item.keterangan) lines.push('<b>Keterangan:</b> ' + escapeHtml(item.keterangan));
            lines.push('<b>Kategori:</b> ' + KATEGORI[kategori].label);
            return lines.join('<br>');
        }

        function geojsonToKML(geojson, folderName) {
            if (!geojson || !geojson.features) return '';
            var lines = [];
            lines.push('    <Folder><name>' + escapeXml(folderName) + '</name>');
            geojson.features.forEach(function(f) {
                var geom = f.geometry; if (!geom) return;
                var name = (f.properties && f.properties.name) || 'Feature';
                lines.push('      <Placemark><name>' + escapeXml(name) + '</name>');
                if (geom.type === 'Point') {
                    lines.push('        <Point><coordinates>' + geom.coordinates[0] + ',' + geom.coordinates[1] + ',0</coordinates></Point>');
                } else if (geom.type === 'LineString') {
                    lines.push('        <LineString><coordinates>' + coordsToKMLString(geom.coordinates) + '</coordinates></LineString>');
                } else if (geom.type === 'MultiLineString') {
                    lines.push('        <MultiGeometry>');
                    geom.coordinates.forEach(function(line){
                        lines.push('          <LineString><coordinates>' + coordsToKMLString(line) + '</coordinates></LineString>');
                    });
                    lines.push('        </MultiGeometry>');
                } else if (geom.type === 'Polygon') {
                    lines.push('        <Polygon><outerBoundaryIs><LinearRing><coordinates>' + coordsToKMLString(geom.coordinates[0]) + '</coordinates></LinearRing></outerBoundaryIs></Polygon>');
                }
                lines.push('      </Placemark>');
            });
            lines.push('    </Folder>');
            return lines.join('\n');
        }

        function coordsToKMLString(coords) {
            return coords.map(function(c){ return c[0] + ',' + c[1] + ',0'; }).join(' ');
        }
        function hexToKMLColor(hex) {
            var r = hex.replace('#', '').substr(0, 2);
            var g = hex.replace('#', '').substr(2, 2);
            var b = hex.replace('#', '').substr(4, 2);
            return 'ff' + b + g + r;
        }
        function escapeXml(str) {
            if (str === null || str === undefined) return '';
            return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;')
                .replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&apos;');
        }
        function escapeHtml(str) {
            if (str === null || str === undefined) return '';
            return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        }
        function downloadBlob(content, filename, mimeType) {
            var blob = new Blob([content], { type: mimeType + ';charset=utf-8;' });
            var url = URL.createObjectURL(blob);
            var a = document.createElement('a');
            a.href = url; a.download = filename;
            document.body.appendChild(a); a.click();
            document.body.removeChild(a); URL.revokeObjectURL(url);
        }
        function getTimestamp() {
            var d = new Date();
            var pad = function(n){ return String(n).padStart(2, '0'); };
            return d.getFullYear() + pad(d.getMonth()+1) + pad(d.getDate()) + '_' + pad(d.getHours()) + pad(d.getMinutes());
        }

        /* ===== TOGGLE DARI LEGENDA ===== */
        document.querySelectorAll('.map-legend .li[data-toggle="line"]').forEach(function(li){
            li.addEventListener('click', function(){ toggleLine(li.dataset.line); });
        });
        document.querySelectorAll('.map-legend .li[data-toggle="marker"]').forEach(function(li){
            li.addEventListener('click', function(){
                var kat = li.dataset.kat;
                markerVisibility[kat] = !markerVisibility[kat];
                markersByType[kat].forEach(function(m){
                    if (markerVisibility[kat]) {
                        if (!markerSource.hasFeature(m.feature)) markerSource.addFeature(m.feature);
                    } else {
                        if (markerSource.hasFeature(m.feature)) markerSource.removeFeature(m.feature);
                    }
                });
                if (markerVisibility[kat]) li.classList.remove('off');
                else li.classList.add('off');
            });
        });

        /* ===== KLIK FITUR (Popup) ===== */
        map.on('singleclick', function(evt){
            var feature = map.forEachFeatureAtPixel(evt.pixel, function(f){ return f; }, {
                hitTolerance: 5
            });
            if (feature) {
                var html = feature.get('popupHtml');
                if (html) {
                    popupContent.innerHTML = html;
                    popupContainer.style.display = 'block';
                    var geometry = feature.getGeometry();
                    var coord;
                    if (geometry.getType() === 'Point') {
                        coord = geometry.getCoordinates();
                    } else {
                        coord = evt.coordinate;
                    }
                    popupOverlay.setPosition(coord);
                }
            } else {
                popupOverlay.setPosition(undefined);
                popupContainer.style.display = 'none';
            }
        });

        // Cursor pointer saat hover fitur
        map.on('pointermove', function(evt){
            var hit = map.hasFeatureAtPixel(evt.pixel, { hitTolerance: 5 });
            map.getTargetElement().style.cursor = hit ? 'pointer' : '';
        });

        /* ===== LISTENER PESAN ===== */
        window.addEventListener('message', function (event) {
            var data = event.data || {};
            if (data.type === 'theme-change'){
                if (data.theme === 'light') document.body.classList.add('light-mode');
                else document.body.classList.remove('light-mode');
            }
            else if (data.type === 'filter-map') terapkanFilter(data.filter);
            else if (data.type === 'reset-map') resetView();
            else if (data.type === 'refresh-markers') renderMarkers();
        });

        window.addEventListener('storage', function(e){
            if (e.key === STORAGE_KEY) renderMarkers();
        });
        setInterval(renderMarkers, 5000);

        /* ===== INIT ===== */
        renderMarkers();
        initAllLines();

        setTimeout(function () { map.updateSize(); }, 200);
        setTimeout(function () { map.updateSize(); }, 800);
        window.addEventListener('resize', function () { map.updateSize(); });
    </script>
