<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maps - BUCIN</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@9.2.4/ol.css" />
    <script src="https://cdn.jsdelivr.net/npm/ol@9.2.4/dist/ol.js"></script>
    <script src="https://unpkg.com/@tmcw/togeojson@5.8.1/dist/togeojson.umd.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

    <style>
        * { box-sizing: border-box; }
        html, body { margin: 0; padding: 0; height: 100%; font-family: 'Poppins', sans-serif; background: #0f172a; overflow: hidden; }
        #map { width: 100%; height: 100%; background: #0f172a; }

        .maps-header {
            position: absolute; top: 0; left: 0; right: 0; height: 44px; z-index: 1000;
            display: flex; align-items: center; gap: 8px; padding: 6px 12px;
            background: rgba(15, 23, 42, 0.92); border-bottom: 1px solid rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(8px);
        }
        .maps-header .header-title { font-size: 12px; font-weight: 800; color: #38bdf8; display: flex; align-items: center; gap: 6px; }
        .maps-header .header-title i { color: #f43f5e; }
        .maps-header .header-title span { color: #e2e8f0; font-weight: 600; font-size: 11px; }

        .header-btn {
            background: transparent; border: 1px solid rgba(255, 255, 255, 0.25); color: #e2e8f0;
            padding: 5px 10px; border-radius: 6px; font-size: 11px; font-weight: 700;
            cursor: pointer; font-family: 'Poppins', sans-serif;
            display: inline-flex; align-items: center; gap: 5px;
            transition: all 0.2s ease;
        }
        .header-btn:hover { color: #38bdf8; border-color: #38bdf8; }
        .header-btn.primary { color: #10b981; border-color: rgba(16, 185, 129, 0.6); }
        .header-btn.primary:hover { background: rgba(16, 185, 129, 0.15); }
        .header-btn.danger { color: #f43f5e; border-color: rgba(244, 63, 94, 0.6); }
        .header-btn.danger:hover { background: rgba(244, 63, 94, 0.15); }
        .header-btn.warning { color: #f59e0b; border-color: rgba(245, 158, 11, 0.6); }
        .header-btn.warning:hover { background: rgba(245, 158, 11, 0.15); }
        .header-btn.active {
            color: #38bdf8; border-color: #38bdf8;
            background: rgba(56, 189, 248, 0.15);
        }

        .map-mode-btn {
            background: rgba(30, 41, 59, 0.8); border: 1px solid rgba(255, 255, 255, 0.2);
            color: #94a3b8; padding: 5px 9px; border-radius: 6px;
            font-size: 10px; font-weight: 700; cursor: pointer; font-family: 'Poppins', sans-serif;
            display: inline-flex; align-items: center; gap: 4px;
        }
        .map-mode-btn:hover { color: #38bdf8; border-color: #38bdf8; }
        .map-mode-btn.active { color: #38bdf8; border-color: #38bdf8; background: rgba(56, 189, 248, 0.15); }

        .map-legend {
            position: absolute; top: 54px; left: 10px;
            background: rgba(15, 23, 42, 0.88); border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 7px; padding: 6px 8px; z-index: 900;
            font-size: 9.5px; color: #e2e8f0; max-width: 175px;
            max-height: calc(100vh - 70px); overflow-y: auto;
        }
        .map-legend h5 { font-size: 9px; color: #38bdf8; margin: 0 0 5px 0; text-transform: uppercase; font-weight: 800; display: flex; align-items: center; gap: 4px; }
        .map-legend .section-title { font-size: 8px; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.5px; font-weight: 800; margin: 5px 0 3px 0; padding-top: 4px; border-top: 1px dashed rgba(255,255,255,0.15); }
        .map-legend .section-title:first-of-type { margin-top: 0; padding-top: 0; border-top: none; }
        .map-legend .li { display: flex; align-items: center; gap: 5px; color: #e2e8f0; padding: 2px 0; cursor: pointer; user-select: none; }
        .map-legend .li:hover { opacity: 0.8; }
        .map-legend .li.off { opacity: 0.3; text-decoration: line-through; }
        .map-legend .li i { font-size: 8px; width: 10px; text-align: center; flex-shrink: 0; }
        .map-legend .li span.count { margin-left: auto; font-weight: 700; color: #38bdf8; font-size: 9px; }
        .map-legend .li span.label-text { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }

        .custom-zoom {
            position: absolute; top: 54px; right: 10px; z-index: 900;
            display: flex; flex-direction: column; gap: 4px;
        }
        .custom-zoom button {
            width: 32px; height: 32px;
            background: rgba(15, 23, 42, 0.92); color: #e2e8f0;
            border: 1px solid rgba(255, 255, 255, 0.25); border-radius: 6px;
            font-size: 14px; font-weight: 700; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
        }
        .custom-zoom button:hover { background: rgba(30, 41, 59, 1); color: #38bdf8; border-color: #38bdf8; }

        .ol-zoom { display: none !important; }
        .ol-attribution { font-size: 10px !important; background: rgba(15, 23, 42, 0.8) !important; border-radius: 4px !important; }
        .ol-attribution a { color: #38bdf8 !important; }
        .ol-attribution button { background: rgba(15, 23, 42, 0.9) !important; color: #e2e8f0 !important; border: none !important; }

        .kml-toast {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(20px);
            z-index: 1100; background: rgba(15, 23, 42, 0.95);
            border: 1px solid rgba(56, 189, 248, 0.5); color: #fff;
            padding: 8px 16px; border-radius: 8px; font-size: 12px; font-weight: 600;
            display: flex; align-items: center; gap: 8px;
            opacity: 0; pointer-events: none; transition: all 0.3s ease;
        }
        .kml-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
        .kml-toast.success { border-color: rgba(16, 185, 129, 0.6); }
        .kml-toast.error { border-color: rgba(244, 63, 94, 0.6); }

        .ol-popup {
            position: absolute; background: rgba(15, 23, 42, 0.98); color: #fff;
            border: 1px solid #38bdf8; border-radius: 10px;
            padding: 10px 12px; font-size: 11px; min-width: 180px; max-width: 300px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.6);
            bottom: 12px; left: -50%; transform: translateX(-50%); z-index: 950;
        }
        .ol-popup::after {
            content: ''; position: absolute; bottom: -8px; left: 50%; transform: translateX(-50%);
            border-width: 8px 8px 0 8px; border-style: solid;
            border-color: rgba(15, 23, 42, 0.98) transparent transparent transparent;
        }
        .ol-popup-closer { position: absolute; top: 4px; right: 6px; font-size: 14px; color: #94a3b8; cursor: pointer; text-decoration: none; font-weight: bold; }
        .ol-popup-closer:hover { color: #f43f5e; }
        .popup-title { font-size: 12px; font-weight: 800; margin-bottom: 5px; display: flex; align-items: center; gap: 5px; }
        .popup-row { font-size: 11px; color: #cbd5e1; line-height: 1.5; }
        .popup-row b { color: #fff; }
        .popup-badge { display: inline-block; padding: 1px 7px; border-radius: 8px; font-size: 9px; font-weight: 700; margin-top: 5px; }

        /* Panel gambar garis */
        .draw-panel {
            position: absolute; top: 54px; right: 60px;
            background: rgba(15, 23, 42, 0.95);
            border: 1px solid rgba(56, 189, 248, 0.5);
            border-radius: 8px; padding: 10px 12px;
            z-index: 950; font-size: 11px; color: #e2e8f0;
            min-width: 220px; display: none;
        }
        .draw-panel.show { display: block; }
        .draw-panel h6 {
            font-size: 10px; color: #38bdf8; margin: 0 0 8px 0;
            text-transform: uppercase; letter-spacing: 0.5px; font-weight: 800;
        }
        .draw-panel .draw-row { margin-bottom: 8px; }
        .draw-panel label {
            display: block; font-size: 10px; color: #94a3b8;
            margin-bottom: 3px; font-weight: 600;
        }
        .draw-panel input[type="text"],
        .draw-panel input[type="color"] {
            width: 100%; background: rgba(30, 41, 59, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 4px; color: #fff; padding: 4px 6px;
            font-size: 11px; font-family: 'Poppins', sans-serif;
        }
        .draw-panel input[type="color"] { height: 28px; padding: 2px; cursor: pointer; }
        .draw-panel .btn-row { display: flex; gap: 6px; margin-top: 8px; }
        .draw-panel .btn-row button {
            flex: 1; background: rgba(30, 41, 59, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #e2e8f0; padding: 5px 8px; border-radius: 4px;
            font-size: 10px; font-weight: 700; cursor: pointer;
            font-family: 'Poppins', sans-serif;
        }
        .draw-panel .btn-row button:hover { border-color: #38bdf8; color: #38bdf8; }
        .draw-panel .btn-row button.save {
            color: #10b981; border-color: rgba(16, 185, 129, 0.5);
        }
        .draw-panel .btn-row button.cancel {
            color: #f43f5e; border-color: rgba(244, 63, 94, 0.5);
        }
        .draw-panel .info-count {
            font-size: 10px; color: #38bdf8; margin-top: 6px;
            text-align: center; font-weight: 700;
        }

        @media (max-width: 640px) {
            .maps-header .header-title span, .header-btn span, .map-mode-btn span { display: none; }
            .map-legend { top: 48px; left: 6px; font-size: 8.5px; max-width: 140px; }
            .custom-zoom { top: 48px; right: 6px; }
            .draw-panel { right: 50px; min-width: 180px; }
        }
    </style>
</head>
<body>

    <div id="map"></div>

    <div class="maps-header">
        <div class="header-title">
            <i class="fa-solid fa-map"></i>
            <span>Peta Insiden Jaringan</span>
        </div>
        <button class="map-mode-btn active" onclick="setMapMode('standard')" id="btnModeStandard"><i class="fa-solid fa-map"></i> <span>Standard</span></button>
        <button class="map-mode-btn" onclick="setMapMode('satellite')" id="btnModeSatellite"><i class="fa-solid fa-satellite"></i> <span>Satelit</span></button>
        <button class="header-btn" onclick="toggleDrawPanel()" id="btnDraw" title="Gambar garis manual">
            <i class="fa-solid fa-pen"></i> <span>Gambar</span>
        </button>
        <button class="header-btn primary" onclick="uploadKML()"><i class="fa-solid fa-cloud-arrow-up"></i> <span>Upload</span></button>
        <button class="header-btn warning" onclick="clearKML()" title="Hapus KML"><i class="fa-solid fa-xmark"></i> <span>Clear</span></button>
        <button class="header-btn danger" onclick="clearAllDrawings()" title="Hapus semua garis manual"><i class="fa-solid fa-trash"></i> <span>Reset</span></button>
    </div>

    <input type="file" id="kmlFileInput" accept=".kml,.kmz" style="display:none;">

    <!-- Panel Gambar Garis -->
    <div class="draw-panel" id="drawPanel">
        <h6><i class="fa-solid fa-pen"></i> Gambar Garis Manual</h6>
        <div class="draw-row">
            <label>Nama Garis</label>
            <input type="text" id="drawName" placeholder="Contoh: FO Cut PNK-TTC" value="">
        </div>
        <div class="draw-row">
            <label>Warna</label>
            <input type="color" id="drawColor" value="#38bdf8">
        </div>
        <div class="btn-row">
            <button class="save" onclick="startDrawing()" id="btnStartDraw">
                <i class="fa-solid fa-play"></i> Mulai
            </button>
            <button onclick="finishDrawing()" id="btnFinishDraw" disabled>
                <i class="fa-solid fa-check"></i> Selesai
            </button>
        </div>
        <div class="btn-row">
            <button class="cancel" onclick="cancelDrawing()" id="btnCancelDraw" disabled>
                <i class="fa-solid fa-xmark"></i> Batal
            </button>
            <button class="cancel" onclick="undoLastPoint()" id="btnUndoPoint" disabled>
                <i class="fa-solid fa-rotate-left"></i> Undo
            </button>
        </div>
        <div class="info-count" id="drawInfo">Klik "Mulai" untuk menggambar</div>
    </div>

    <div class="map-legend">
        <h5><i class="fa-solid fa-list"></i> Legenda</h5>
        <div class="section-title">Data Input</div>
        <div class="li" data-toggle="marker" data-kat="focut">
            <i class="fa-solid fa-scissors" style="color:#f43f5e;"></i>
            <span class="label-text">FO Cut</span>
            <span class="count" id="cntFocut">0</span>
        </div>
        <div class="li" data-toggle="marker" data-kat="temuan">
            <i class="fa-solid fa-magnifying-glass" style="color:#10b981;"></i>
            <span class="label-text">Temuan</span>
            <span class="count" id="cntTemuan">0</span>
        </div>
        <div class="li" data-toggle="marker" data-kat="opm">
            <i class="fa-solid fa-wave-square" style="color:#38bdf8;"></i>
            <span class="label-text">OPM/OLS</span>
            <span class="count" id="cntOpm">0</span>
        </div>
        <div class="li" data-toggle="marker" data-kat="joint">
            <i class="fa-solid fa-circle-nodes" style="color:#f59e0b;"></i>
            <span class="label-text">Joint</span>
            <span class="count" id="cntJoint">0</span>
        </div>
        <div class="li" data-toggle="marker" data-kat="handhole">
            <i class="fa-solid fa-box-open" style="color:#a855f7;"></i>
            <span class="label-text">Handhole</span>
            <span class="count" id="cntHandhole">0</span>
        </div>

        <div class="section-title">Gambar Manual</div>
        <div class="li" data-toggle="drawn">
            <i class="fa-solid fa-pen" style="color:#38bdf8;"></i>
            <span class="label-text">Garis Manual</span>
            <span class="count" id="cntDrawn">0</span>
        </div>
        <div class="li" data-toggle="kml">
            <i class="fa-solid fa-file-import" style="color:#10b981;"></i>
            <span class="label-text">KML Upload</span>
            <span class="count" id="cntKml">0</span>
        </div>
    </div>

    <div class="custom-zoom">
        <button onclick="zoomIn()" title="Zoom In"><i class="fa-solid fa-plus"></i></button>
        <button onclick="zoomOut()" title="Zoom Out"><i class="fa-solid fa-minus"></i></button>
    </div>

    <div class="kml-toast" id="kmlToast"></div>

    <div id="popup" class="ol-popup" style="display:none;">
        <a href="#" id="popup-closer" class="ol-popup-closer">&times;</a>
        <div id="popup-content"></div>
    </div>

    <script>
        /* ============================================================
           BUCIN MAP - 2 Mode + Upload KML + Gambar Garis Manual
           ============================================================ */

        var MANADO_CENTER = [124.8421, 1.4748];
        var MANADO_ZOOM   = 11;

        /* ============================================================
           VIEW
           ============================================================ */
        var view = new ol.View({
            center: ol.proj.fromLonLat(MANADO_CENTER),
            zoom: MANADO_ZOOM,
            maxZoom: 19,
            minZoom: 3
        });

        /* ============================================================
           BASEMAPS
           ============================================================ */
        var baseLayerStandard = new ol.layer.Tile({
            source: new ol.source.OSM({
                url: 'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
                attributions: '© OpenStreetMap contributors',
                crossOrigin: 'anonymous'
            }),
            visible: true,
            zIndex: 0
        });

        var baseLayerSatellite = new ol.layer.Tile({
            source: new ol.source.XYZ({
                url: 'https://services.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
                attributions: 'Powered by Esri',
                crossOrigin: 'anonymous',
                maxZoom: 19
            }),
            visible: false,
            zIndex: 0
        });

        /* ============================================================
           KATEGORI MARKER
           ============================================================ */
        var KATEGORI = {
            focut:    { warna: '#f43f5e', label: 'FO Cut',    icon: '✂️' },
            temuan:   { warna: '#10b981', label: 'Temuan',    icon: '🔍' },
            opm:      { warna: '#38bdf8', label: 'OPM / OLS', icon: '📊' },
            joint:    { warna: '#f59e0b', label: 'Joint',     icon: '🔗' },
            handhole: { warna: '#a855f7', label: 'Handhole',  icon: '📦' }
        };

        var markerSource = new ol.source.Vector();
        var markerLayer = new ol.layer.Vector({
            source: markerSource,
            zIndex: 10,
            style: function(feature) {
                var kat = feature.get('kategori');
                var warna = KATEGORI[kat] ? KATEGORI[kat].warna : '#38bdf8';
                return new ol.style.Style({
                    image: new ol.style.Circle({
                        radius: 8,
                        fill: new ol.style.Fill({ color: warna }),
                        stroke: new ol.style.Stroke({ color: '#fff', width: 2 })
                    })
                });
            }
        });

        /* ============================================================
           KML LAYER (di atas marker)
           ============================================================ */
        var kmlSource = new ol.source.Vector();
        var kmlLayer = new ol.layer.Vector({
            source: kmlSource,
            zIndex: 20,
            style: function(feature) {
                var t = feature.getGeometry().getType();
                if (t === 'LineString' || t === 'MultiLineString') {
                    return new ol.style.Style({
                        stroke: new ol.style.Stroke({ color: '#10b981', width: 4, lineCap: 'round', lineJoin: 'round' })
                    });
                }
                if (t === 'Polygon' || t === 'MultiPolygon') {
                    return new ol.style.Style({
                        stroke: new ol.style.Stroke({ color: '#10b981', width: 2 }),
                        fill: new ol.style.Fill({ color: 'rgba(16, 185, 129, 0.2)' })
                    });
                }
                // Point
                return new ol.style.Style({
                    image: new ol.style.Circle({
                        radius: 7,
                        fill: new ol.style.Fill({ color: '#10b981' }),
                        stroke: new ol.style.Stroke({ color: '#fff', width: 2 })
                    })
                });
            }
        });

        /* ============================================================
           DRAWING LAYER (garis manual)
           ============================================================ */
        var drawSource = new ol.source.Vector();
        var drawLayer = new ol.layer.Vector({
            source: drawSource,
            zIndex: 15,
            style: function(feature) {
                var color = feature.get('color') || '#38bdf8';
                return new ol.style.Style({
                    stroke: new ol.style.Stroke({
                        color: color,
                        width: 4,
                        lineCap: 'round',
                        lineJoin: 'round',
                        lineDash: feature.get('isDraft') ? [8, 6] : null
                    }),
                    image: new ol.style.Circle({
                        radius: 5,
                        fill: new ol.style.Fill({ color: color }),
                        stroke: new ol.style.Stroke({ color: '#fff', width: 2 })
                    })
                });
            }
        });

        // Draft layer untuk preview saat menggambar
        var draftSource = new ol.source.Vector();
        var draftLayer = new ol.layer.Vector({
            source: draftSource,
            zIndex: 25,
            style: new ol.style.Style({
                stroke: new ol.style.Stroke({
                    color: '#f59e0b',
                    width: 3,
                    lineDash: [8, 6]
                }),
                image: new ol.style.Circle({
                    radius: 6,
                    fill: new ol.style.Fill({ color: '#f59e0b' }),
                    stroke: new ol.style.Stroke({ color: '#fff', width: 2 })
                })
            })
        });

        /* ============================================================
           MAP
           ============================================================ */
        var map = new ol.Map({
            target: 'map',
            layers: [
                baseLayerStandard,
                baseLayerSatellite,
                drawLayer,
                markerLayer,
                kmlLayer,
                draftLayer
            ],
            view: view,
            controls: ol.control.defaults.defaults({ attribution: true, zoom: false, rotate: false })
        });

        var attrControl = map.getControls().getArray().find(function(c) { return c instanceof ol.control.Attribution; });
        if (attrControl) attrControl.setPosition('bottom-right');

        /* ============================================================
           ZOOM BUTTONS
           ============================================================ */
        function zoomIn()  { var v = map.getView(); v.animate({ zoom: v.getZoom() + 1, duration: 200 }); }
        function zoomOut() { var v = map.getView(); v.animate({ zoom: v.getZoom() - 1, duration: 200 }); }

        /* ============================================================
           MODE SWITCHER (2 mode saja)
           ============================================================ */
        function setMapMode(mode) {
            document.querySelectorAll('.map-mode-btn').forEach(function(b){ b.classList.remove('active'); });
            if (mode === 'standard') {
                baseLayerStandard.setVisible(true);
                baseLayerSatellite.setVisible(false);
                document.getElementById('btnModeStandard').classList.add('active');
                showToast('Mode: Standard 2D', 'info');
            } else if (mode === 'satellite') {
                baseLayerStandard.setVisible(false);
                baseLayerSatellite.setVisible(true);
                document.getElementById('btnModeSatellite').classList.add('active');
                showToast('Mode: Citra Satelit', 'info');
            }
        }

        /* ============================================================
           DATA
           ============================================================ */
        var STORAGE_KEY = 'bucin_data';
        var DRAW_STORAGE_KEY = 'bucin_drawings';
        var markers = [];
        var markersByType = { focut: [], temuan: [], opm: [], joint: [], handhole: [] };
        var markerVisibility = { focut: true, temuan: true, opm: true, joint: true, handhole: true };
        var kmlActiveFile = null;
        var kmlVisible = true;
        var drawnVisible = true;

        /* ============================================================
           POPUP
           ============================================================ */
        var popupContainer = document.getElementById('popup');
        var popupContent   = document.getElementById('popup-content');
        var popupCloser    = document.getElementById('popup-closer');
        var popupOverlay = new ol.Overlay({
            element: popupContainer,
            autoPan: { animation: { duration: 250 } },
            positioning: 'bottom-center',
            offset: [0, -12]
        });
        map.addOverlay(popupOverlay);

        popupCloser.onclick = function() {
            popupOverlay.setPosition(undefined);
            popupContainer.style.display = 'none';
            return false;
        };

        function showToast(msg, type) {
            var toast = document.getElementById('kmlToast');
            var icon = type === 'error' ? 'fa-circle-exclamation' : type === 'success' ? 'fa-circle-check' : 'fa-circle-info';
            var color = type === 'error' ? '#f43f5e' : type === 'success' ? '#10b981' : '#38bdf8';
            toast.innerHTML = '<i class="fa-solid ' + icon + '" style="color:' + color + ';"></i> ' + msg;
            toast.className = 'kml-toast show ' + (type || '');
            setTimeout(function() { toast.classList.remove('show'); }, 3500);
        }

        function getData(){
            try {
                var raw = localStorage.getItem(STORAGE_KEY);
                if(!raw) return { focut: [], temuan: [], opm: [], joint: [], handhole: [] };
                var d = JSON.parse(raw);
                return { focut: d.focut||[], temuan: d.temuan||[], opm: d.opm||[], joint: d.joint||[], handhole: d.handhole||[] };
            } catch(e){ return { focut: [], temuan: [], opm: [], joint: [], handhole: [] }; }
        }

        function getKoordinat(item){
            var lat = parseFloat(item.lat || item.latitude || item.koordinat_lat || item.lintang || item.y || '');
            var lng = parseFloat(item.lng || item.lon || item.longitude || item.koordinat_lng || item.bujur || item.x || '');
            if ((isNaN(lat) || isNaN(lng)) && item.koordinat){
                var parts = String(item.koordinat).split(',');
                if (parts.length === 2){ lat = parseFloat(parts[0].trim()); lng = parseFloat(parts[1].trim()); }
            }
            if (isNaN(lat) || isNaN(lng)) return null;
            return [lat, lng];
        }

        function buatPopup(item, kategori){
            var k = KATEGORI[kategori];
            var html = '<div class="popup-title" style="color:' + k.warna + ';">' + k.icon + ' ' + k.label + '</div>';
            var fields = [
                ['Lokasi', item.lokasi || item.site || item.nama],
                ['Tanggal', item.tanggal || item.tgl || item.date],
                ['Penyebab', item.penyebab],
                ['Jalur', item.jalur],
                ['Status', item.status],
                ['Keterangan', item.keterangan || item.deskripsi || item.catatan]
            ];
            fields.forEach(function(f){ if (f[1]) html += '<div class="popup-row"><b>' + f[0] + ':</b> ' + f[1] + '</div>'; });
            html += '<span class="popup-badge" style="background:' + k.warna + '22;color:' + k.warna + ';border:1px solid ' + k.warna + ';">' + k.label.toUpperCase() + '</span>';
            return html;
        }

        function renderMarkers(){
            markers.forEach(function(m){ markerSource.removeFeature(m.feature); });
            markers = [];
            markersByType = { focut: [], temuan: [], opm: [], joint: [], handhole: [] };
            var data = getData();
            var counters = { focut: 0, temuan: 0, opm: 0, joint: 0, handhole: 0 };

            Object.keys(KATEGORI).forEach(function(kat){
                (data[kat] || []).forEach(function(item){
                    var koord = getKoordinat(item);
                    if (!koord) return;
                    var feature = new ol.Feature({
                        geometry: new ol.geom.Point(ol.proj.fromLonLat([koord[1], koord[0]])),
                        kategori: kat
                    });
                    feature.set('popupHtml', buatPopup(item, kat));
                    feature.set('data', item);
                    if (markerVisibility[kat]) markerSource.addFeature(feature);
                    var obj = { feature: feature, kategori: kat, data: item };
                    markers.push(obj);
                    markersByType[kat].push(obj);
                    counters[kat]++;
                });
            });

            document.getElementById('cntFocut').textContent    = counters.focut;
            document.getElementById('cntTemuan').textContent   = counters.temuan;
            document.getElementById('cntOpm').textContent      = counters.opm;
            document.getElementById('cntJoint').textContent    = counters.joint;
            document.getElementById('cntHandhole').textContent = counters.handhole;
        }

        /* ============================================================
           KML UPLOAD - DIPERBAIKI
           ============================================================ */
        function uploadKML() { document.getElementById('kmlFileInput').click(); }

        document.getElementById('kmlFileInput').addEventListener('change', function(e){
            var file = e.target.files[0];
            if (!file) return;
            loadKMLFile(file);
            e.target.value = '';
        });

        function loadKMLFile(file) {
            var fileName = file.name;
            var isKMZ = fileName.toLowerCase().endsWith('.kmz');
            showToast('Mengupload: ' + fileName + '...', 'info');

            if (isKMZ) {
                var reader = new FileReader();
                reader.onload = function(ev) {
                    JSZip.loadAsync(ev.target.result).then(function(zip){
                        var kmlName = null;
                        zip.forEach(function(p){ if (!kmlName && p.toLowerCase().endsWith('.kml')) kmlName = p; });
                        if (!kmlName) { showToast('KMZ tidak berisi KML', 'error'); return; }
                        return zip.file(kmlName).async('string');
                    }).then(function(text){ if (text) renderKMLFromString(text, fileName); })
                    .catch(function(err){ showToast('Gagal baca KMZ: ' + err.message, 'error'); });
                };
                reader.onerror = function() { showToast('Gagal baca file', 'error'); };
                reader.readAsArrayBuffer(file);
            } else {
                var reader = new FileReader();
                reader.onload = function(ev) { renderKMLFromString(ev.target.result, fileName); };
                reader.onerror = function() { showToast('Gagal baca file', 'error'); };
                reader.readAsText(file);
            }
        }

        function renderKMLFromString(kmlText, fileName) {
            try {
                kmlSource.clear();

                var parser = new DOMParser();
                var kmlDom = parser.parseFromString(kmlText, 'text/xml');
                if (kmlDom.querySelector('parsererror')) {
                    showToast('KML tidak valid (parse error)', 'error');
                    return;
                }

                var lib = window.toGeoJSON || window.togeojson;
                if (!lib) { showToast('Library togeojson tidak tersedia', 'error'); return; }

                var geojson = lib.kml(kmlDom);
                console.log('[KML] GeoJSON:', geojson);

                if (!geojson || !geojson.features || !geojson.features.length) {
                    showToast('KML tidak berisi fitur valid', 'error');
                    return;
                }

                // Deteksi projection
                var dataProj = 'EPSG:4326';
                if (geojson.crs && geojson.crs.properties && geojson.crs.properties.name) {
                    var crsName = geojson.crs.properties.name;
                    console.log('[KML] CRS terdeteksi:', crsName);
                }

                var format = new ol.format.GeoJSON();
                var features = format.readFeatures(geojson, {
                    dataProjection: dataProj,
                    featureProjection: 'EPSG:3857'
                });

                console.log('[KML] Fitur di-parse:', features.length);

                // Set popup untuk setiap fitur
                features.forEach(function(f){
                    var name = f.get('name') || (f.getProperties() && f.getProperties().name) || 'Unnamed';
                    var desc = f.get('description') || '';
                    var html = '<div class="popup-title" style="color:#10b981;"><i class="fa-solid fa-file-import"></i> KML</div>' +
                               '<div class="popup-row"><b>Nama:</b> ' + name + '</div>';
                    if (desc) html += '<div class="popup-row"><b>Deskripsi:</b> ' + desc + '</div>';
                    f.set('popupHtml', html);
                });

                kmlSource.addFeatures(features);
                kmlActiveFile = fileName;
                kmlVisible = true;
                updateKmlCount();

                // Zoom ke extent KML
                try {
                    var ext = kmlSource.getExtent();
                    console.log('[KML] Extent:', ext);
                    if (ext && isFinite(ext[0]) && isFinite(ext[2]) && (ext[0] !== ext[2])) {
                        view.fit(ext, { padding: [80, 80, 80, 80], duration: 600, maxZoom: 16 });
                        showToast('Berhasil upload ' + features.length + ' fitur', 'success');
                    } else {
                        showToast('Berhasil upload ' + features.length + ' fitur (extent tidak valid)', 'success');
                    }
                } catch(e) {
                    console.warn('fit bounds error:', e);
                    showToast('Berhasil upload ' + features.length + ' fitur', 'success');
                }
            } catch(err) {
                console.error('KML parse error:', err);
                showToast('Gagal parse KML: ' + err.message, 'error');
            }
        }

        function updateKmlCount() {
            document.getElementById('cntKml').textContent = kmlSource.getFeatures().length;
        }

        function clearKML() {
            if (kmlSource.getFeatures().length === 0) { showToast('Tidak ada KML aktif', 'info'); return; }
            if (!confirm('Hapus KML dari peta?')) return;
            kmlSource.clear();
            kmlActiveFile = null;
            updateKmlCount();
            showToast('KML dihapus', 'success');
        }

        /* ============================================================
           GAMBAR GARIS MANUAL
           ============================================================ */
        var isDrawing = false;
        var currentDrawCoords = [];      // array of [lon, lat] dalam EPSG:3857
        var draftFeature = null;
        var drawNameInput = document.getElementById('drawName');
        var drawColorInput = document.getElementById('drawColor');
        var drawInfo = document.getElementById('drawInfo');
        var btnStartDraw = document.getElementById('btnStartDraw');
        var btnFinishDraw = document.getElementById('btnFinishDraw');
        var btnCancelDraw = document.getElementById('btnCancelDraw');
        var btnUndoPoint = document.getElementById('btnUndoPoint');

        function toggleDrawPanel() {
            var panel = document.getElementById('drawPanel');
            panel.classList.toggle('show');
            document.getElementById('btnDraw').classList.toggle('active', panel.classList.contains('show'));
        }

        function startDrawing() {
            isDrawing = true;
            currentDrawCoords = [];
            draftSource.clear();
            btnStartDraw.disabled = true;
            btnFinishDraw.disabled = true;
            btnCancelDraw.disabled = false;
            btnUndoPoint.disabled = true;
            drawInfo.textContent = 'Klik di peta untuk menambah titik...';
            map.getTargetElement().style.cursor = 'crosshair';
            showToast('Mode gambar aktif — klik di peta', 'info');
        }

        function finishDrawing() {
            if (currentDrawCoords.length < 2) {
                showToast('Minimal 2 titik untuk membuat garis', 'error');
                return;
            }

            var name = (drawNameInput.value || '').trim() || ('Garis ' + new Date().toLocaleTimeString('id-ID'));
            var color = drawColorInput.value || '#38bdf8';

            // Konversi koordinat EPSG:3857 ke EPSG:4326 untuk penyimpanan
            var coords4326 = currentDrawCoords.map(function(c) {
                return ol.proj.toLonLat(c);
            });

            var feature = new ol.Feature({
                geometry: new ol.geom.LineString(currentDrawCoords),
                name: name,
                color: color,
                coords4326: coords4326,
                isDraft: false
            });
            feature.set('popupHtml',
                '<div class="popup-title" style="color:' + color + ';">' +
                    '<i class="fa-solid fa-pen"></i> ' + name +
                '</div>' +
                '<div class="popup-row"><b>Total titik:</b> ' + currentDrawCoords.length + '</div>' +
                '<div class="popup-row"><b>Tipe:</b> Garis Manual</div>' +
                '<span class="popup-badge" style="background:' + color + '22;color:' + color + ';border:1px solid ' + color + ';">MANUAL</span>'
            );

            drawSource.addFeature(feature);
            saveDrawings();
            updateDrawCount();

            resetDrawingState();
            showToast('Garis "' + name + '" tersimpan (' + currentDrawCoords.length + ' titik)', 'success');
        }

        function cancelDrawing() {
            resetDrawingState();
            showToast('Gambar dibatalkan', 'info');
        }

        function undoLastPoint() {
            if (currentDrawCoords.length === 0) return;
            currentDrawCoords.pop();
            updateDraft();
            if (currentDrawCoords.length >= 2) {
                btnFinishDraw.disabled = false;
            } else {
                btnFinishDraw.disabled = true;
            }
            if (currentDrawCoords.length === 0) {
                btnUndoPoint.disabled = true;
            }
            drawInfo.textContent = 'Titik: ' + currentDrawCoords.length;
        }

        function updateDraft() {
            draftSource.clear();
            if (currentDrawCoords.length === 0) return;

            // Gambar titik-titik
            currentDrawCoords.forEach(function(c) {
                draftSource.addFeature(new ol.Feature({
                    geometry: new ol.geom.Point(c)
                }));
            });

            // Gambar garis draft
            if (currentDrawCoords.length >= 2) {
                draftSource.addFeature(new ol.Feature({
                    geometry: new ol.geom.LineString(currentDrawCoords)
                }));
            }
        }

        function resetDrawingState() {
            isDrawing = false;
            currentDrawCoords = [];
            draftSource.clear();
            btnStartDraw.disabled = false;
            btnFinishDraw.disabled = true;
            btnCancelDraw.disabled = true;
            btnUndoPoint.disabled = true;
            drawInfo.textContent = 'Klik "Mulai" untuk menggambar';
            map.getTargetElement().style.cursor = '';
        }

        // Klik di peta saat mode gambar
        map.on('singleclick', function(evt) {
            if (isDrawing) {
                currentDrawCoords.push(evt.coordinate);
                updateDraft();
                btnUndoPoint.disabled = false;
                if (currentDrawCoords.length >= 2) {
                    btnFinishDraw.disabled = false;
                }
                drawInfo.textContent = 'Titik: ' + currentDrawCoords.length + ' (klik "Selesai" untuk menyimpan)';
                return;
            }

            // Popup normal (bukan mode gambar)
            var feature = map.forEachFeatureAtPixel(evt.pixel, function(f){ return f; }, { hitTolerance: 5 });
            if (feature) {
                var html = feature.get('popupHtml');
                if (html) {
                    popupContent.innerHTML = html;
                    popupContainer.style.display = 'block';
                    var g = feature.getGeometry();
                    popupOverlay.setPosition(g.getType() === 'Point' ? g.getCoordinates() : evt.coordinate);
                }
            } else {
                popupOverlay.setPosition(undefined);
                popupContainer.style.display = 'none';
            }
        });

        map.on('pointermove', function(evt) {
            if (isDrawing) {
                map.getTargetElement().style.cursor = 'crosshair';
                return;
            }
            map.getTargetElement().style.cursor = map.hasFeatureAtPixel(evt.pixel, { hitTolerance: 5 }) ? 'pointer' : '';
        });

        /* ============================================================
           SIMPAN / LOAD GARIS MANUAL
           ============================================================ */
        function saveDrawings() {
            try {
                var data = drawSource.getFeatures().map(function(f) {
                    return {
                        name: f.get('name'),
                        color: f.get('color'),
                        coords4326: f.get('coords4326')
                    };
                });
                localStorage.setItem(DRAW_STORAGE_KEY, JSON.stringify(data));
            } catch(e) {
                console.warn('Gagal simpan drawings:', e);
            }
        }

        function loadDrawings() {
            try {
                var raw = localStorage.getItem(DRAW_STORAGE_KEY);
                if (!raw) return;
                var data = JSON.parse(raw);
                data.forEach(function(item) {
                    if (!item.coords4326 || item.coords4326.length < 2) return;
                    var coords3857 = item.coords4326.map(function(c) {
                        return ol.proj.fromLonLat(c);
                    });
                    var feature = new ol.Feature({
                        geometry: new ol.geom.LineString(coords3857),
                        name: item.name || 'Garis',
                        color: item.color || '#38bdf8',
                        coords4326: item.coords4326,
                        isDraft: false
                    });
                    feature.set('popupHtml',
                        '<div class="popup-title" style="color:' + (item.color || '#38bdf8') + ';">' +
                            '<i class="fa-solid fa-pen"></i> ' + (item.name || 'Garis') +
                        '</div>' +
                        '<div class="popup-row"><b>Total titik:</b> ' + item.coords4326.length + '</div>' +
                        '<div class="popup-row"><b>Tipe:</b> Garis Manual</div>' +
                        '<span class="popup-badge" style="background:' + (item.color || '#38bdf8') + '22;color:' + (item.color || '#38bdf8') + ';border:1px solid ' + (item.color || '#38bdf8') + ';">MANUAL</span>'
                    );
                    drawSource.addFeature(feature);
                });
                updateDrawCount();
            } catch(e) {
                console.warn('Gagal load drawings:', e);
            }
        }

        function updateDrawCount() {
            document.getElementById('cntDrawn').textContent = drawSource.getFeatures().length;
        }

        function clearAllDrawings() {
            if (drawSource.getFeatures().length === 0) { showToast('Tidak ada garis manual', 'info'); return; }
            if (!confirm('Hapus SEMUA garis manual?')) return;
            drawSource.clear();
            localStorage.removeItem(DRAW_STORAGE_KEY);
            updateDrawCount();
            showToast('Semua garis manual dihapus', 'success');
        }

        /* ============================================================
           TOGGLE LEGENDA
           ============================================================ */
        document.querySelectorAll('.map-legend .li[data-toggle="marker"]').forEach(function(li){
            li.addEventListener('click', function(){
                var kat = li.dataset.kat;
                markerVisibility[kat] = !markerVisibility[kat];
                markersByType[kat].forEach(function(m){
                    if (markerVisibility[kat]) { if (!markerSource.hasFeature(m.feature)) markerSource.addFeature(m.feature); }
                    else { if (markerSource.hasFeature(m.feature)) markerSource.removeFeature(m.feature); }
                });
                li.classList.toggle('off', !markerVisibility[kat]);
            });
        });

        document.querySelectorAll('.map-legend .li[data-toggle="kml"]').forEach(function(li){
            li.addEventListener('click', function(){
                kmlVisible = !kmlVisible;
                kmlLayer.setVisible(kmlVisible);
                li.classList.toggle('off', !kmlVisible);
            });
        });

        document.querySelectorAll('.map-legend .li[data-toggle="drawn"]').forEach(function(li){
            li.addEventListener('click', function(){
                drawnVisible = !drawnVisible;
                drawLayer.setVisible(drawnVisible);
                li.classList.toggle('off', !drawnVisible);
            });
        });

        /* ============================================================
           INIT
           ============================================================ */
        renderMarkers();
        loadDrawings();

        setTimeout(function(){ map.updateSize(); }, 200);
        setTimeout(function(){ map.updateSize(); }, 800);
        window.addEventListener('resize', function(){ map.updateSize(); });
    </script>
</body>
</html>
